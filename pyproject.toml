[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "on-the-fly-models"
version = "0.1.0"
description = "Generate task-specific models on-the-fly by predicting their weights from data"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "datasets",
    "lightning",
    "matplotlib",
    "muon-optimizer",
    "omegaconf",
    "scikit-learn",
    "torch",
    "umap-learn",
    "wandb",
]

[tool.setuptools.packages.find]
exclude = ["data*", "notebooks*", "tests*", "outputs*", "logs*", "wandb*"]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff>=0.11",
]

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["on_the_fly_models"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: depends on a built dataset on disk and takes real time to run (excluded by default, run with `pytest -m slow`)",
]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
muon-optimizer = { git = "https://github.com/KellerJordan/Muon" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
