# Recipe for the compositional-generalization question: does a hypernetwork trained on 14
# in-distribution ARC-1D task categories generalise zero-shot to 10 synthetic categories that
# chain two of those rules together (data/arc_1d_compositional_holdout, already built -- see
# legacy/configs/experiments/arc1d_hypermodel_compositional_generalization/README.md for the
# generator, rule semantics, and combo-selection rationale, all reused unmodified here)?
#
# As of this session, this config is documentation/provenance only -- NOT the active training
# recipe. Both arms now reuse experiment 2's own dim=4 matched-scale checkpoints directly
# (outputs/02_hypernetwork_multitask/hyper_multitask_dim4_{notd,frozentd}_seed{1..5}/, trained
# on this exact 14-category recipe already) rather than training here from scratch -- see
# run.sh and this experiment's README for the full reasoning (in short: no need to duplicate a
# training run that already exists at the right architecture and data recipe). Kept accurate
# and buildable in case a genuine from-scratch retrain is ever needed (e.g. a future dim=6
# version) -- frozen_td.yaml specifically is still directly used, as the architecture template
# scripts/eval_compositional_holdout.py builds its model from when evaluating experiment 2's
# checkpoint after pad_frozentd_checkpoint.py extends it to num_tasks=28.
#
# Architecture is the "matched-scale" recipe from experiment 2's own sizing sweep (10,156
# trainable hypernetwork params, built around the dim=4 target model -- 1,398 params) --
# identical to experiments/02_hypernetwork_multitask/configs/dim4_notd.yaml/dim4_frozentd.yaml
# except num_tasks (28 here, reserving 10 indices for the composite holdout categories; 18 in
# experiment 2, which has no reason to reserve them for its own purposes).
#
# task_categories/val_task_categories: the standard 14-category v2 list (drops 1d_recolor_cmp
# from this experiment's own 15-category predecessor, arc1d_v2_compositional_generalization --
# safe, since none of the 10 composite specs in data_modules/arc1d_compositional.py involve it,
# and frozen_td's num_tasks=28 is sized off the fixed 18-category TASK_CATEGORY_INDEX registry
# in models/hypermodel_lightning.py, not off how many categories this list has).
#
# Self-contained (no _base_ of its own), matching every sibling base.yaml, because the config
# loader only resolves one level of _base_ inheritance (training/config.py's load_config).
project_name: 04_compositional_generalization
entity: fjfehr
output_dir: outputs
seed: 42
experiment_name: compositional_generalization
output_path: ${output_dir}/${project_name}/${experiment_name}

data: arc_1d_meta_multiclass
data_dir: data/arc_1d_looped_augmented
model: hyper_model
primary_metric: val_loss
num_workers: 0

task_categories:
  - 1d_denoising_1c
  - 1d_denoising_mc
  - 1d_fill
  - 1d_flip
  - 1d_hollow
  - 1d_mirror
  - 1d_move_1p
  - 1d_move_2p
  - 1d_move_2p_dp
  - 1d_move_3p
  - 1d_move_dp
  - 1d_pcopy_1c
  - 1d_pcopy_mc
  - 1d_scale_dp
task_ids: null
val_task_categories:
  - 1d_denoising_1c
  - 1d_denoising_mc
  - 1d_fill
  - 1d_flip
  - 1d_hollow
  - 1d_mirror
  - 1d_move_1p
  - 1d_move_2p
  - 1d_move_2p_dp
  - 1d_move_3p
  - 1d_move_dp
  - 1d_pcopy_1c
  - 1d_pcopy_mc
  - 1d_scale_dp
train_split: train
val_split: val
test_split: test
overfit_single_batch: false

accelerator: auto
float32_matmul_precision: medium
precision: bf16-mixed
devices: 1
save_checkpoints: true

optimizer: Muon
muon_lr: 0.005
muon_momentum: 0.95
batch_size: 512
learning_rate: 0.001
weight_decay: 0.01
gradient_clip_val: 10.0
lr_scheduler:
  name: CosineAnnealingLR
  params:
    T_max: ${max_steps}
    eta_min: 0.0001
max_steps: 8000
warmup_steps: 800
N_supervision: 1

log_task_examples: true
log_task_examples_every_n_epochs: 100
num_periodic_train_task_examples: 100
num_periodic_val_task_examples: 100
log_embedding_clusters: true

prediction_task: multiclass
num_classes: 10
padding_idx: 10
stop_on_perfect_val_exact_match: false

task_encoding:
  embedding_dim: 4
  value_vocab_size: 11
  use_sinusoidal_pe: false

# Flat (n_loops=1), matched to the "matched-scale" dim=4 target from
# arc1d_v2_hypernetwork_multitask -- not the older recipe's looped (n_loops=4) hidden_dim=16
# target.
target_model:
  name: rope_canon_looped_transformer
  params:
    hidden_dim: 4
    num_heads: 1
    inner_dim: 4
    inner_num_heads: 1
    n_loops: 1
    dropout: 0.1
    canon_set: ABCD
    canon_kernel: 5
    canon_activation: true
    canon_residual: true
    canon_causal: false
    use_block_skip: false
    use_loop_skip: false

# Plain (non-Zhu) rope_canon_transformer, matched-width to the dim=4 target -- not the older
# recipe's rope_canon_zhu_transformer/hidden_dim=64/8-layer encoder.
hyper_model:
  name: rope_canon_transformer
  params:
    hidden_dim: 4
    num_heads: 1
    num_layers: 1
    output_dim: 4
    canon_set: ABCD
    canon_kernel: 5
    canon_activation: true
    canon_residual: true
    canon_causal: false
    block_size: 2048

# Placeholder default: notd (no task-identity signal). Overridden per leaf for frozen_td.
hyper_head:
  pooling: attention
  bottleneck_dim: 8
  num_tasks: null
  freeze_task_indicator: false
  lora_adapter: false
