# Frozen (untrained, random-init) task-identity descriptor. num_tasks=28, not the usual 18
# (models/hypermodel_lightning.py's TASK_CATEGORY_INDEX size) -- reserves 10 extra indices
# (18..27) for the held-out compositional categories, assigned by
# scripts/eval_compositional_holdout.py at eval time. Indices 18-27 are never sampled during this
# training run (only the 14 in-distribution categories in task_categories/val_task_categories
# are), so this is safe: the frozen projection matrix's extra rows are simply additional
# random-but-fixed directions the model never had a reason to rely on, exactly like the 4
# in-training-vocab-but-not-in-this-run rows it also never learns (freeze_task_indicator: true
# keeps the whole projection at its random init throughout training). Same mechanism as
# arc1d_v2_compositional_generalization/frozen_td.yaml -- see its README.md.
#
# Plain (learned, unfrozen) td is deliberately not built for this experiment at all -- matches
# arc1d_v2_hypernetwork_multitask's own choice to exclude it ("historically bimodal/unstable"),
# and a learned one-hot embedding is undefined on indices it never saw during training anyway.
_base_: experiments/04_compositional_generalization/configs/base.yaml
experiment_name: v2_compositional_generalization_14task_frozentd

hyper_head:
  num_tasks: 28
  freeze_task_indicator: true
