# Frozen (untrained, random-init) task-identity descriptor. num_tasks=28, not the usual 18
# (models/hypermodel_lightning.py's TASK_CATEGORY_INDEX size) -- reserves 10 extra indices
# (18..27) for the held-out compositional categories, assigned by
# scripts/eval_compositional_holdout.py at eval time. Indices 18-27 are never sampled during
# training (only the 14 in-distribution categories in task_categories/val_task_categories are),
# so this is safe: the frozen projection matrix's extra rows are simply additional
# random-but-fixed directions the model never had a reason to rely on (freeze_task_indicator:
# true keeps the whole projection at its random init throughout training, trained or not).
#
# Plain (learned, unfrozen) td is deliberately not built for this experiment at all -- matches
# experiment 2's own choice to exclude it ("historically bimodal/unstable"), and a learned
# one-hot embedding is undefined on indices it never saw during training anyway.
#
# Still directly used, unlike notd.yaml's purely-documentation role: run.sh builds a model from
# THIS config (num_tasks=28) and loads experiment 2's own frozen_td checkpoint into it after
# pad_frozentd_checkpoint.py extends that checkpoint's task_indicator_proj from 18 to 28
# columns -- see this experiment's README for why that padding is statistically valid (the
# whole projection is frozen/never-trained either way).
_base_: experiments/04_compositional_generalization/configs/base.yaml
experiment_name: frozentd

hyper_head:
  num_tasks: 28
  freeze_task_indicator: true
