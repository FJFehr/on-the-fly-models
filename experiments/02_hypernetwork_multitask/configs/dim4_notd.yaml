# Dim-4 hypernetwork, every part sized to the dim-4 target; no task identity.

_base_: experiments/02_hypernetwork_multitask/configs/base.yaml
experiment_name: hyper_multitask_dim4_notd

task_encoding:
  embedding_dim: 4

target:
  hidden_dim: 4

encoder:
  hidden_dim: 4
  num_heads: 1
  num_layers: 1
  output_dim: 4

hyper_head:
  bottleneck_dim: 8
  num_tasks: null
  freeze_task_indicator: false
