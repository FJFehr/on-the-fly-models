# Experiment 6, individual arm: experiment 1's individual dim-4 recipe at reduced training data.
# See ../README.md. Data levels and the category are set by configs/<category>/*.yaml.
# evaluate_on: final scores the weights training ended with (saved as final_model.ckpt).

project_name: 06_data_efficiency_ablation_individual
entity: fjfehr
output_dir: outputs
seed: 42
experiment_name: ${experiment_name}
logging_name: ${experiment_name}
output_path: ${output_dir}/${project_name}/${experiment_name}

data: arc_1d_direct
data_dir: data/arc_1d_looped_augmented
model: direct
primary_metric: val_loss
evaluate_on: final
stop_on_perfect_val_exact_match: false
num_workers: 1
save_checkpoints: true

task_categories: null
task_ids: null
val_task_categories: null
train_split: train
val_split: dev
test_split: test
overfit_single_batch: false

accelerator: auto
float32_matmul_precision: medium
devices: 1
optimizer: Muon
muon_lr: 0.005
muon_momentum: 0.95
batch_size: 256
learning_rate: 0.0005
weight_decay: 0.01
lr_scheduler:
  name: CosineAnnealingLR
  params:
    T_max: ${max_steps}
    eta_min: 0.0
max_steps: 8000
warmup_steps: 200
log_task_examples: true
log_task_examples_every_n_epochs: 200
non_background_loss_weight: 1.0

prediction_task: multiclass
num_classes: 10
padding_idx: 10

variants_per_base_task: null
base_tasks_per_category: null
data_seed: 42

task_encoding:
  embedding_dim: 10
  use_sinusoidal_pe: false

backbone:
  hidden_dim: 4
  num_layers: 3
  num_heads: 1
  dropout: 0.1
  canon_set: ABCD
  canon_kernel: 5
