# Base config for the arc1d_lowdata "no hypernetwork" capacity baseline.
#
# Companion to arc1d_lowdata: trains the EXACT SAME target architecture
# (rope_canon_looped_transformer, hidden_dim=4/n_loops=1/dropout=0.1, identical
# Canon settings -- experiment 2's own dim=4 matched-scale target), no
# hypernetwork, no weight generation, no cross-task sharing at all. One model
# per task category, per data level, per seed. This isolates whether
# arc1d_lowdata's data efficiency comes specifically from cross-task transfer
# through the shared hypernetwork backbone, or whether a plain single-task
# model needs just as little data.
#
# 2026-09-14: unified onto experiment 1's own dim=4 Individual recipe exactly
# (01_multitask_capacity/configs/individual/*/dim4.yaml), not just its
# architecture -- an earlier version of this file matched the architecture
# but silently diverged on the actual training regime: model:
# looped_supervised (now direct_supervised, matching 01 -- LoopedSupervised's
# own N_supervision=2 doubled the real optimizer-step count per batch, see
# training/trainer.py's max_steps*N_supervision Trainer wiring, and isn't
# what 01's own reference used at all), max_steps 2000 -> 8000, learning_rate
# 0.001 -> 0.0005, gradient_clip_val 10.0 -> removed (01 has none, and
# direct_supervised's automatic optimization means Lightning's own automatic
# clipping would have newly activated here if left in), task_encoding.
# embedding_dim 4 -> 10 (01 holds this fixed at 10 across its whole dim
# sweep -- it sizes the value/example/role embedding tables feeding a
# Linear(embedding_dim -> hidden_dim) projection into the backbone, confirmed
# in models/task_token_embedder.py + direct_supervised_lightning.py, so it's
# real input capacity independent of hidden_dim, not something that should
# shrink with it here). This was caught by a discrepancy between this arm's
# own `full`-level results (macro 86.3%) and 01's own established dim=4
# Individual ceiling (92.6%) -- see experiments/06_data_efficiency_ablation/
# individual/README.md's "2026-09-14 unification" note for the full story.
# All 280 jobs from before this were invalidated and rerun.
#
# Data-reduction mechanism is the same stratified/nested variants_per_base_task
# sampling as arc1d_lowdata (see data_modules/arc1d_direct.py's
# _stratified_variants_per_base_task, ported verbatim from
# data_modules/arc1d_meta_multiclass.py), applied to the same data_seed=42
# rows from the same data/arc_1d_looped_augmented dataset -- so at a given
# level, both experiments train on the identical underlying task-variant rows.
#
# Known asymmetry (documented, not "fixed"): Arc1dDirectDataModule unpacks
# each selected row into its 3 support (input, output) pairs only (the row's
# query is held out for the separate dev/test splits) -- so 3 raw supervised
# pairs/row here, vs. 4 in arc1d_lowdata (which also supervises the row's own
# query reconstruction as part of the hypernetwork's training loss). This is
# an inherent difference between the two datamodules' established
# conventions, not something changed for this comparison.
#
# Optimizer: Muon (lr=0.005), matching arc1d_lowdata exactly to remove
# optimizer choice as a confound -- the same muon_lr=0.005 experiment 1's own
# dim=4 optimizer ablation (01_multitask_capacity) already validated at this
# exact target architecture; consistency with arc1d_lowdata was prioritised
# over re-testing the AdamW alternative here.
#
# Self-contained (no _base_ of its own) -- the config loader only resolves one
# level of _base_ inheritance (training/config.py), so settings that would
# otherwise come from arc1d_recursion_ablation/base_ablation.yaml (data:
# arc_1d_direct, data_dir, batch_size, etc.) are inlined here directly instead.
project_name: arc1d_lowdata_baseline
entity: fjfehr
output_dir: outputs
seed: 42
experiment_name: ${experiment_name}
logging_name: ${experiment_name}
output_path: ${output_dir}/${project_name}/${experiment_name}

data: arc_1d_direct
data_dir: data/arc_1d_looped_augmented
model: direct_supervised
primary_metric: val_loss
stop_on_perfect_val_exact_match: false
num_workers: 1
save_checkpoints: false

task_categories: null
task_ids: null
val_task_categories: null
train_split: train
val_split: dev
test_split: test
overfit_single_batch: false

accelerator: auto
float32_matmul_precision: medium
devices: 1
optimizer: Muon
muon_lr: 0.005
muon_momentum: 0.95
batch_size: 256
learning_rate: 0.0005
weight_decay: 0.01
lr_scheduler:
  name: CosineAnnealingLR
  params:
    T_max: ${max_steps}
    eta_min: 0.0
max_steps: 8000
warmup_steps: 200
log_task_examples: true
log_task_examples_every_n_epochs: 200
non_background_loss_weight: 1.0

prediction_task: multiclass
num_classes: 10
padding_idx: 10

# variants_per_base_task is a placeholder here, overridden per leaf (see {category}/v*.yaml).
variants_per_base_task: null
data_seed: 42

task_encoding:
  embedding_dim: 10
  value_vocab_size: 11
  use_sinusoidal_pe: false

backbone_model:
  name: rope_canon_looped_transformer
  params:
    hidden_dim: 4
    num_heads: 1
    inner_dim: 4
    inner_num_heads: 1
    n_loops: 1
    dropout: 0.1
    canon_set: ABCD
    canon_kernel: 5
    canon_activation: true
    canon_residual: true
    canon_causal: false
    use_block_skip: false
    use_loop_skip: false
