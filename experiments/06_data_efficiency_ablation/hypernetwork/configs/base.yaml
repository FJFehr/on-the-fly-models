# Base config for the low-data hypernetwork experiment. Fixed architecture: experiment 2's own
# dim=4 matched-scale recipe (02_hypernetwork_multitask/configs/dim4_frozentd.yaml /
# dim4_notd.yaml, ~11.4K/~11.3K total hypernetwork params), frozen_td vs. notd task-identity
# conditioning (hyper_head.num_tasks/freeze_task_indicator are placeholders, overridden per
# leaf -- see below), Muon optimizer at the same muon_lr=0.005 experiment 2 already validated
# for this exact architecture.
#
# 2026-09-10: resized from the original scaffolding's inherited
# arc1d_hypermodel_looped_rope_canon_muon recipe (Zhu backbone, dim=16 target, ~1.58M-param
# hypernetwork) -- that recipe predated the 2026-09-09 dim=4-matched-scale unification and was
# never reconciled with it; running data-efficiency at a ~139x-larger, incomparable scale wasn't
# worth the extra compute. Also dropped 1d_recolor_cmp (14 categories now, matching 01/02/05,
# not the original 15), and added notd as a second condition (originally frozentd-only,
# reasoned as "not worth carrying into this axis" per experiment 2's full-data finding -- but
# notd is exactly what pairs against ../joint/'s own notd arm, so it's needed for a like-for-like
# comparison at every data level, not just at full data).
#
# 2026-09-14: unified onto experiment 2's own training regime exactly, not just its
# architecture -- an earlier version of this file matched architecture/optimizer but silently
# diverged on four things: N_supervision 2 -> 1 and max_steps 2000 -> 8000 (02's own comment
# spells out the equivalence -- N_supervision x max_steps is the real optimizer-step budget via
# training/trainer.py's Trainer(max_steps=max_steps*N_supervision) wiring, so this was running
# at half 02's "Round 2 convention" budget, not the 4x-fewer it looked like from max_steps
# alone), warmup_steps 200 -> 800 (same 10% fraction, scaled back up with max_steps), and
# devices auto -> 1 (the big one: with no batch-size rescaling anywhere in this codebase --
# checked data_modules/*.py -- devices: auto's 8-way DDP on a full node gave batch_size=512 an
# effective global batch of 4096, 8x 02's own single-GPU 512; hypernetwork/run.sh moved to the
# same GPUS=-parallel-slot pattern joint/individual already use, to not lose throughput now that
# devices is back to 1). Caught while investigating why arc1d_lowdata_baseline's own `full`-level
# result didn't match experiment 1's established ceiling -- see that arm's own base.yaml for the
# individual-side half of this story. All 70 jobs from before this were invalidated and rerun.
#
# This experiment's only axis: variants_per_base_task (train-side data reduction), via the
# Arc1dMetaMulticlassDataModule.variants_per_base_task/data_seed parameters
# (data_modules/arc1d_meta_multiclass.py). Hypothesis: the hypernetwork needs less training
# data than a model with no cross-task transfer, because it shares one hypernetwork backbone
# across all tasks rather than learning each task in isolation. Sampling is stratified per
# underlying base task (not uniform over the raw pool - an earlier version of this experiment
# used pool-uniform sampling and it silently conflated data volume with task diversity, since
# low counts ended up covering fewer distinct base tasks) and nested/cumulative: level K always
# includes the true original (unaugmented) example for every base task first, then K-1
# additional augmented variants in a fixed data_seed order, so level K's training set is always
# a subset of level K+1's. data_seed is fixed (not tied to the training seed) so all 3 training
# seeds at a given data level see identical training data -- only training initialization
# varies, isolating training-init variance from data-selection variance.
#
# Validation/test are NOT reduced -- variants_per_base_task only applies to the train split
# (data_modules/arc1d_meta_multiclass.py's setup()), so every data level is evaluated on the
# same fixed 100-examples-per-category dev/test split, in-distribution (task_categories ==
# val_task_categories, full 14-task list matching 01/02/05, no held-out axis).
#
# Self-contained (no _base_ of its own) -- the config loader only resolves one level of _base_
# inheritance (training/config.py).
project_name: arc1d_lowdata
entity: fjfehr
output_dir: outputs
seed: 42
experiment_name: lowdata
output_path: ${output_dir}/${project_name}/${experiment_name}

data: arc_1d_meta_multiclass
data_dir: data/arc_1d_looped_augmented
model: hyper_model
primary_metric: val_loss
num_workers: 0
# Disk space on the shared cluster home is tight - this sweep only needs the
# final metrics (results.txt/wandb), not the model weights themselves.
save_checkpoints: false

task_categories:
  - 1d_denoising_1c
  - 1d_denoising_mc
  - 1d_fill
  - 1d_flip
  - 1d_hollow
  - 1d_mirror
  - 1d_move_1p
  - 1d_move_2p
  - 1d_move_2p_dp
  - 1d_move_3p
  - 1d_move_dp
  - 1d_pcopy_1c
  - 1d_pcopy_mc
  - 1d_scale_dp
task_ids: null
val_task_categories:
  - 1d_denoising_1c
  - 1d_denoising_mc
  - 1d_fill
  - 1d_flip
  - 1d_hollow
  - 1d_mirror
  - 1d_move_1p
  - 1d_move_2p
  - 1d_move_2p_dp
  - 1d_move_3p
  - 1d_move_dp
  - 1d_pcopy_1c
  - 1d_pcopy_mc
  - 1d_scale_dp
train_split: train
val_split: val
test_split: test
overfit_single_batch: false

# variants_per_base_task is a placeholder here, overridden per leaf (see
# cell_{frozentd,notd}_v*.yaml).
variants_per_base_task: null
# base_tasks_per_category is a placeholder here too, overridden per t{N} leaf
# (added 2026-09-15 for the sub-40-base-tasks-per-category axis -- how many
# distinct base tasks/category to use, at variants_per_base_task=1 always,
# going below the v1 floor's ~40 base tasks; see
# data_modules/arc1d_meta_multiclass.py's _stratified_base_tasks_per_category).
# null = no reduction (all ~40 base tasks/category), same as leaving it unset
# -- every existing cell_*_v*/full leaf above is unaffected by this addition.
base_tasks_per_category: null
data_seed: 42

accelerator: auto
float32_matmul_precision: medium
precision: bf16-mixed
devices: 1
optimizer: Muon
muon_lr: 0.005
muon_momentum: 0.95
batch_size: 512
learning_rate: 0.001
weight_decay: 0.01
gradient_clip_val: 10.0
lr_scheduler:
  name: CosineAnnealingLR
  params:
    T_max: ${max_steps}
    eta_min: 0.0001
max_steps: 8000
warmup_steps: 800
log_task_examples: true
log_task_examples_every_n_epochs: 100
num_periodic_train_task_examples: 100
num_periodic_val_task_examples: 100

prediction_task: multiclass
num_classes: 10
padding_idx: 10
stop_on_perfect_val_exact_match: false

N_supervision: 1

task_encoding:
  embedding_dim: 4
  value_vocab_size: 11
  use_sinusoidal_pe: false

target_model:
  name: rope_canon_looped_transformer
  params:
    hidden_dim: 4
    num_heads: 1
    inner_dim: 4
    inner_num_heads: 1
    n_loops: 1
    dropout: 0.1
    canon_set: ABCD
    canon_kernel: 5
    canon_activation: true
    canon_residual: true
    canon_causal: false
    use_block_skip: false
    use_loop_skip: false

hyper_model:
  name: rope_canon_transformer
  params:
    hidden_dim: 4
    num_heads: 1
    num_layers: 1
    output_dim: 4
    canon_set: ABCD
    canon_kernel: 5
    canon_activation: true
    canon_residual: true
    canon_causal: false
    block_size: 2048

# num_tasks/freeze_task_indicator are placeholders here, overridden per leaf: 18/true
# (frozentd) or null/false (notd) -- see cell_{frozentd,notd}_v*.yaml, matching
# 02_hypernetwork_multitask/configs/dim4_frozentd.yaml / dim4_notd.yaml's own convention.
hyper_head:
  pooling: attention
  bottleneck_dim: 8
  num_tasks: null
  freeze_task_indicator: null
  lora_adapter: false
