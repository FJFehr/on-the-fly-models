# Experiment 6, hypernetwork arm: experiment 2's dim-4 recipe at reduced training data. See ../README.md.
# variants_per_base_task / base_tasks_per_category are set per level by the cell_*.yaml configs.
# evaluate_on: final scores the weights training ended with (saved as final_model.ckpt).

project_name: 06_data_efficiency_ablation_hypernetwork
entity: fjfehr
output_dir: outputs
seed: 42
experiment_name: lowdata
output_path: ${output_dir}/${project_name}/${experiment_name}

data: arc_1d_meta_multiclass
data_dir: data/arc_1d_looped_augmented
model: hypernetwork
primary_metric: val_loss
evaluate_on: final
num_workers: 0
save_checkpoints: true

task_categories:
  - 1d_denoising_1c
  - 1d_denoising_mc
  - 1d_fill
  - 1d_flip
  - 1d_hollow
  - 1d_mirror
  - 1d_move_1p
  - 1d_move_2p
  - 1d_move_2p_dp
  - 1d_move_3p
  - 1d_move_dp
  - 1d_pcopy_1c
  - 1d_pcopy_mc
  - 1d_scale_dp
task_ids: null
val_task_categories:
  - 1d_denoising_1c
  - 1d_denoising_mc
  - 1d_fill
  - 1d_flip
  - 1d_hollow
  - 1d_mirror
  - 1d_move_1p
  - 1d_move_2p
  - 1d_move_2p_dp
  - 1d_move_3p
  - 1d_move_dp
  - 1d_pcopy_1c
  - 1d_pcopy_mc
  - 1d_scale_dp
train_split: train
val_split: val
test_split: test
overfit_single_batch: false

variants_per_base_task: null
base_tasks_per_category: null
data_seed: 42

accelerator: auto
float32_matmul_precision: medium
precision: bf16-mixed
devices: 1
optimizer: Muon
muon_lr: 0.005
muon_momentum: 0.95
batch_size: 512
learning_rate: 0.001
weight_decay: 0.01
gradient_clip_val: 10.0
lr_scheduler:
  name: CosineAnnealingLR
  params:
    T_max: ${max_steps}
    eta_min: 0.0001
max_steps: 8000
warmup_steps: 800
log_task_examples: true
log_task_examples_every_n_epochs: 100
num_periodic_train_task_examples: 100
num_periodic_val_task_examples: 100

prediction_task: multiclass
num_classes: 10
padding_idx: 10
stop_on_perfect_val_exact_match: false

task_encoding:
  embedding_dim: 4
  use_sinusoidal_pe: false

target:
  hidden_dim: 4
  num_layers: 3
  num_heads: 1
  dropout: 0.1
  canon_set: ABCD
  canon_kernel: 5

encoder:
  hidden_dim: 4
  num_heads: 1
  num_layers: 1
  output_dim: 4
  canon_set: ABCD
  canon_kernel: 5

hyper_head:
  bottleneck_dim: 8
  num_tasks: null
  freeze_task_indicator: null
