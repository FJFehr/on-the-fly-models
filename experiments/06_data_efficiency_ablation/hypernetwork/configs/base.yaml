# Base config for the low-data hypernetwork experiment. Fixed architecture, carried over
# unchanged from arc1d_hypermodel_looped_rope_canon_muon's conclusions: Zhu block backbone
# (RMSNorm + QK-norm + SwiGLU), frozen_td task-identity conditioning (hyper_head.num_tasks: 18,
# freeze_task_indicator: true -- near-ceiling ~99% exact match vs ~68% for notd), Muon optimizer
# at its already-validated stable muon_lr=0.005 (Keller Jordan's published default of 0.02
# diverged to NaN at global_step ~915/4000 in this exact architecture -- not worth re-risking
# across every cell of a new sweep). See arc1d_hypermodel_looped_rope_canon_muon/README.md for
# the full prior analysis.
#
# This experiment's only axis: variants_per_base_task (train-side data reduction), via the
# Arc1dMetaMulticlassDataModule.variants_per_base_task/data_seed parameters
# (data_modules/arc1d_meta_multiclass.py). Hypothesis: the hypernetwork needs less training
# data than a model with no cross-task transfer, because it shares one hypernetwork backbone
# across all tasks rather than learning each task in isolation. Sampling is stratified per
# underlying base task (not uniform over the raw pool - an earlier version of this experiment
# used pool-uniform sampling and it silently conflated data volume with task diversity, since
# low counts ended up covering fewer distinct base tasks) and nested/cumulative: level K always
# includes the true original (unaugmented) example for every base task first, then K-1
# additional augmented variants in a fixed data_seed order, so level K's training set is always
# a subset of level K+1's. data_seed is fixed (not tied to the training seed) so all 3 training
# seeds at a given data level see identical training data -- only training initialization
# varies, isolating training-init variance from data-selection variance.
#
# Validation/test are NOT reduced -- variants_per_base_task only applies to the train split
# (data_modules/arc1d_meta_multiclass.py's setup()), so every data level is evaluated on the
# same fixed 100-examples-per-category dev/test split, in-distribution (task_categories ==
# val_task_categories, full 15-task list, no held-out axis), matching the muon experiment.
#
# Self-contained (no _base_ of its own) -- the config loader only resolves one level of _base_
# inheritance (training/config.py).
project_name: arc1d_lowdata
entity: fjfehr
output_dir: outputs
seed: 42
experiment_name: lowdata
output_path: ${output_dir}/${project_name}/${experiment_name}

data: arc_1d_meta_multiclass
data_dir: data/arc_1d_looped_augmented
model: hyper_model
primary_metric: val_loss
num_workers: 0
# Disk space on the shared cluster home is tight - this sweep only needs the
# final metrics (results.txt/wandb), not the model weights themselves.
save_checkpoints: false

task_categories:
  - 1d_denoising_1c
  - 1d_denoising_mc
  - 1d_fill
  - 1d_flip
  - 1d_hollow
  - 1d_mirror
  - 1d_move_1p
  - 1d_move_2p
  - 1d_move_2p_dp
  - 1d_move_3p
  - 1d_move_dp
  - 1d_pcopy_1c
  - 1d_pcopy_mc
  - 1d_recolor_cmp
  - 1d_scale_dp
task_ids: null
val_task_categories:
  - 1d_denoising_1c
  - 1d_denoising_mc
  - 1d_fill
  - 1d_flip
  - 1d_hollow
  - 1d_mirror
  - 1d_move_1p
  - 1d_move_2p
  - 1d_move_2p_dp
  - 1d_move_3p
  - 1d_move_dp
  - 1d_pcopy_1c
  - 1d_pcopy_mc
  - 1d_recolor_cmp
  - 1d_scale_dp
train_split: train
val_split: val
test_split: test
overfit_single_batch: false

# variants_per_base_task is a placeholder here, overridden per leaf (see cell_v*.yaml).
variants_per_base_task: null
data_seed: 42

accelerator: auto
float32_matmul_precision: medium
precision: bf16-mixed
devices: auto
optimizer: Muon
muon_lr: 0.005
muon_momentum: 0.95
batch_size: 512
learning_rate: 0.001
weight_decay: 0.01
gradient_clip_val: 10.0
lr_scheduler:
  name: CosineAnnealingLR
  params:
    T_max: ${max_steps}
    eta_min: 0.0001
max_steps: 2000
warmup_steps: 200
log_task_examples: true
log_task_examples_every_n_epochs: 100
num_periodic_train_task_examples: 100
num_periodic_val_task_examples: 100

prediction_task: multiclass
num_classes: 10
padding_idx: 10
stop_on_perfect_val_exact_match: false

N_supervision: 2

task_encoding:
  embedding_dim: 16
  value_vocab_size: 11
  use_sinusoidal_pe: false

target_model:
  name: rope_canon_looped_transformer
  params:
    hidden_dim: 16
    num_heads: 2
    inner_dim: 16
    inner_num_heads: 2
    n_loops: 4
    dropout: 0.1
    canon_set: ABCD
    canon_kernel: 5
    canon_activation: true
    canon_residual: true
    canon_causal: false
    use_block_skip: false
    use_loop_skip: false

hyper_model:
  name: rope_canon_zhu_transformer
  params:
    hidden_dim: 64
    num_heads: 4
    num_layers: 8
    output_dim: 64
    canon_set: ABCD
    canon_kernel: 5
    canon_activation: true
    canon_residual: true
    canon_causal: false
    use_rmsnorm: true
    use_qk_norm: true
    use_swiglu: true
    dropout: 0.1

hyper_head:
  pooling: attention
  bottleneck_dim: 128
  num_tasks: 18
  freeze_task_indicator: true
  lora_adapter: true
  lora_adapter_rank: 8
  lora_adapter_zero_backbone: false
