# Base config for the multitask capacity experiment (paper experiment #1).
# Direct-supervised RoPE-Canon-Looped-Transformer trained jointly across all
# 14 ARC-1D task categories, with vs. without a task-identity embedding
# ("td"/"notd"), swept across a shrinking hidden_dim to find the capacity
# cliff. Inherited unchanged from its original home (arc1d_recursion_ablation,
# where this backbone size/step-budget recipe was first established).
project_name: 01_multitask_capacity
entity: fjfehr
output_dir: outputs
seed: 42
experiment_name: ${experiment_name}
logging_name: ${experiment_name}
output_path: ${output_dir}/${project_name}/${experiment_name}

data: arc_1d_direct
data_dir: data/arc_1d_looped_augmented
primary_metric: val_loss
# Evaluate the weights training ended with (saved as final_model.ckpt), as for every
# published result of this experiment; best_model.ckpt/last.ckpt are kept as well.
evaluate_on: final
stop_on_perfect_val_exact_match: false

task_categories: null
task_ids: null
val_task_categories: null
train_split: train
val_split: dev
test_split: test
overfit_single_batch: false

accelerator: auto
float32_matmul_precision: medium
devices: 1
num_workers: 1
optimizer: RAdam
batch_size: 256
learning_rate: 0.001
weight_decay: 0.01
warmup_steps: 200
lr_scheduler:
  name: CosineAnnealingLR
  params:
    T_max: ${max_steps}
    eta_min: 0.0
log_task_examples: true
log_task_examples_every_n_epochs: 200
non_background_loss_weight: 1.0

prediction_task: multiclass
num_classes: 10
padding_idx: 10

task_encoding:
  embedding_dim: 32
