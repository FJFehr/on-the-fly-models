_base_: experiments/01_multitask_capacity/configs/base.yaml
project_name: 01_multitask_capacity
save_checkpoints: true
model: direct
optimizer: AdamW
max_steps: 8000
backbone:
  hidden_dim: 14
  num_layers: 3
  num_heads: 1
  dropout: 0.1
  canon_set: ABCD
  canon_kernel: 5
experiment_name: joint_adamw_notd_dim14
task_categories:
- 1d_denoising_1c
- 1d_denoising_mc
- 1d_fill
- 1d_flip
- 1d_hollow
- 1d_mirror
- 1d_move_1p
- 1d_move_2p
- 1d_move_2p_dp
- 1d_move_3p
- 1d_move_dp
- 1d_pcopy_1c
- 1d_pcopy_mc
- 1d_scale_dp
task_encoding:
  embedding_dim: 10
  use_sinusoidal_pe: false
  use_task_embedding: false
