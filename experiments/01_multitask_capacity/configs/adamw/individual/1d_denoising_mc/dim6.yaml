_base_: experiments/01_multitask_capacity/configs/base.yaml
project_name: 01_multitask_capacity
save_checkpoints: false
model: direct_supervised
optimizer: AdamW
max_steps: 8000
backbone_model:
  name: rope_canon_looped_transformer
  params:
    hidden_dim: 6
    num_heads: 1
    inner_dim: 6
    inner_num_heads: 1
    n_loops: 1
    dropout: 0.1
    canon_set: ABCD
    canon_kernel: 5
    canon_activation: true
    canon_residual: true
    canon_causal: false
    use_block_skip: false
    use_loop_skip: false
experiment_name: individual_adamw_dim6_1d_denoising_mc
task_categories:
- 1d_denoising_mc
task_encoding:
  embedding_dim: 10
  value_vocab_size: 11
  use_sinusoidal_pe: false
  use_task_embedding: false
