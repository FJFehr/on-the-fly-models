_base_: experiments/01_multitask_capacity/configs/base.yaml
project_name: 01_multitask_capacity
save_checkpoints: false
model: direct_supervised
optimizer: Muon
muon_lr: 0.005
muon_momentum: 0.95
learning_rate: 0.0005
max_steps: 8000
backbone_model:
  name: rope_canon_looped_transformer
  params:
    hidden_dim: 14
    num_heads: 1
    inner_dim: 14
    inner_num_heads: 1
    n_loops: 1
    dropout: 0.1
    canon_set: ''
    canon_kernel: 5
    canon_activation: true
    canon_residual: true
    canon_causal: false
    use_block_skip: false
    use_loop_skip: false
experiment_name: individual_nocanon_dim14_1d_hollow
task_categories:
- 1d_hollow
task_encoding:
  embedding_dim: 10
  value_vocab_size: 11
  use_sinusoidal_pe: false
  use_task_embedding: false
