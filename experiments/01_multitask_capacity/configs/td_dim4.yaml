# Experiment 2b at dim=4: joint 14-task training, WITH task embedding ("td").
#
# Same as td.yaml (use_task_embedding: true), but on the dim=4 minimal
# architecture from Experiment 1 instead of RC1's dim=10 - does task
# identity still recover most of the joint-training gap at this much
# smaller size? task_encoding.embedding_dim stays fixed at 10.
_base_: experiments/01_multitask_capacity/configs/base.yaml
experiment_name: joint_td_dim4
project_name: 01_multitask_capacity
task_categories:
- 1d_denoising_1c
- 1d_denoising_mc
- 1d_fill
- 1d_flip
- 1d_hollow
- 1d_mirror
- 1d_move_1p
- 1d_move_2p
- 1d_move_2p_dp
- 1d_move_3p
- 1d_move_dp
- 1d_pcopy_1c
- 1d_pcopy_mc
- 1d_scale_dp
save_checkpoints: false
model: direct
optimizer: Muon
muon_lr: 0.005
muon_momentum: 0.95
learning_rate: 0.0005
max_steps: 8000
task_encoding:
  embedding_dim: 10
  use_sinusoidal_pe: false
  use_task_embedding: true
backbone:
  hidden_dim: 4
  num_layers: 3
  num_heads: 1
  dropout: 0.1
  canon_set: ABCD
  canon_kernel: 5
