# Experiment 2a at dim=6: joint 14-task training, NO task embedding ("notd").
#
# Same as notd.yaml, but on the dim=6 architecture from Experiment 1
# (2,444 params individually, near-ceiling at 0.989 - see
# docs/arc1d_story/06_phase1_findings.md), between RC1's dim=10 and the
# much smaller dim=4. task_encoding.embedding_dim stays fixed at 10.
_base_: experiments/01_multitask_capacity/configs/base.yaml
experiment_name: v2_multitask_notd_dim6
project_name: 01_multitask_capacity
task_categories:
- 1d_denoising_1c
- 1d_denoising_mc
- 1d_fill
- 1d_flip
- 1d_hollow
- 1d_mirror
- 1d_move_1p
- 1d_move_2p
- 1d_move_2p_dp
- 1d_move_3p
- 1d_move_dp
- 1d_pcopy_1c
- 1d_pcopy_mc
- 1d_scale_dp
save_checkpoints: false
model: direct_supervised
optimizer: Muon
muon_lr: 0.005
muon_momentum: 0.95
learning_rate: 0.0005
max_steps: 8000
task_encoding:
  embedding_dim: 10
  value_vocab_size: 11
  use_sinusoidal_pe: false
  use_task_embedding: false
backbone_model:
  name: rope_canon_looped_transformer
  params:
    hidden_dim: 6
    num_heads: 1
    inner_dim: 6
    inner_num_heads: 1
    n_loops: 1
    dropout: 0.1
    canon_set: ABCD
    canon_kernel: 5
    canon_activation: true
    canon_residual: true
    canon_causal: false
    use_block_skip: false
    use_loop_skip: false
