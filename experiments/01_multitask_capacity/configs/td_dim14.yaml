# Experiment 2c at dim=14: joint 14-task training, WITH task embedding ("td").
#
# Same as td.yaml (use_task_embedding: true), but at the ~10K-param
# scaffold size (9,508 params individually) flagged as a TODO in
# experiments/README.md's rerun list -- not yet run. task_encoding.embedding_dim
# stays fixed at 10, matching every other size in this sweep.
_base_: experiments/01_multitask_capacity/configs/base.yaml
experiment_name: joint_td_dim14
project_name: 01_multitask_capacity
task_categories:
- 1d_denoising_1c
- 1d_denoising_mc
- 1d_fill
- 1d_flip
- 1d_hollow
- 1d_mirror
- 1d_move_1p
- 1d_move_2p
- 1d_move_2p_dp
- 1d_move_3p
- 1d_move_dp
- 1d_pcopy_1c
- 1d_pcopy_mc
- 1d_scale_dp
save_checkpoints: true
model: direct
optimizer: Muon
muon_lr: 0.005
muon_momentum: 0.95
learning_rate: 0.0005
max_steps: 8000
task_encoding:
  embedding_dim: 10
  use_sinusoidal_pe: false
  use_task_embedding: true
backbone:
  hidden_dim: 14
  num_layers: 3
  num_heads: 1
  dropout: 0.1
  canon_set: ABCD
  canon_kernel: 5
