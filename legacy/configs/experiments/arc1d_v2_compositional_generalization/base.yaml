# Base config for the v2-scale rerun of the compositional-generalization question: train a
# hypernetwork on 15 in-distribution ARC-1D task categories, zero-shot test on 10 synthetic
# categories that chain two of those rules together (data/arc_1d_compositional_holdout, already
# built -- see configs/experiments/arc1d_hypermodel_compositional_generalization/README.md for
# the generator, rule semantics, and combo-selection rationale, all reused unmodified here).
#
# Architecture is the "matched-scale" recipe from arc1d_v2_hypernetwork_multitask's sizing sweep
# (10,156 params, dense generation, 95.7% mean in-distribution exact match at dim=4 -- the
# smallest config in that sweep that still held up), not the older, much bigger
# rope_canon_zhu_transformer/hidden_dim=64/8-layer recipe the original
# arc1d_hypermodel_compositional_generalization run used. See
# experiments/02_hypernetwork_multitask/configs/shrink_matched_dim4.yaml /
# base.yaml for the source of every architecture/optimizer/budget value below.
#
# Task set kept at the original compositional experiment's 15 categories (not v2's 14 -- v2
# dropped 1d_recolor_cmp for an unrelated capacity-isolation reason), so this stays an
# apples-to-apples comparison against the already-run bigger-recipe version at the same task set.
#
# Critical deviation from its v2 source: save_checkpoints: true. The sizing-sweep configs this
# architecture is copied from ran with save_checkpoints: false (they never evaluated on a held-out
# set); this experiment needs the checkpoint for scripts/eval_compositional_holdout.py afterward.
#
# Self-contained (no _base_ of its own), matching every sibling base.yaml, because the config
# loader only resolves one level of _base_ inheritance (training/config.py's load_config).
project_name: arc1d_v2_compositional_generalization
entity: fjfehr
output_dir: outputs
seed: 42
experiment_name: v2_compositional_generalization
output_path: ${output_dir}/${project_name}/${experiment_name}

data: arc_1d_meta_multiclass
data_dir: data/arc_1d_looped_augmented
model: hyper_model
primary_metric: val_loss
num_workers: 0

task_categories:
  - 1d_denoising_1c
  - 1d_denoising_mc
  - 1d_fill
  - 1d_flip
  - 1d_hollow
  - 1d_mirror
  - 1d_move_1p
  - 1d_move_2p
  - 1d_move_2p_dp
  - 1d_move_3p
  - 1d_move_dp
  - 1d_pcopy_1c
  - 1d_pcopy_mc
  - 1d_recolor_cmp
  - 1d_scale_dp
task_ids: null
val_task_categories:
  - 1d_denoising_1c
  - 1d_denoising_mc
  - 1d_fill
  - 1d_flip
  - 1d_hollow
  - 1d_mirror
  - 1d_move_1p
  - 1d_move_2p
  - 1d_move_2p_dp
  - 1d_move_3p
  - 1d_move_dp
  - 1d_pcopy_1c
  - 1d_pcopy_mc
  - 1d_recolor_cmp
  - 1d_scale_dp
train_split: train
val_split: val
test_split: test
overfit_single_batch: false

accelerator: auto
float32_matmul_precision: medium
precision: bf16-mixed
devices: 1
save_checkpoints: true

optimizer: Muon
muon_lr: 0.005
muon_momentum: 0.95
batch_size: 512
learning_rate: 0.001
weight_decay: 0.01
gradient_clip_val: 10.0
lr_scheduler:
  name: CosineAnnealingLR
  params:
    T_max: ${max_steps}
    eta_min: 0.0001
max_steps: 8000
warmup_steps: 800
N_supervision: 1

log_task_examples: true
log_task_examples_every_n_epochs: 100
num_periodic_train_task_examples: 100
num_periodic_val_task_examples: 100
log_embedding_clusters: true

prediction_task: multiclass
num_classes: 10
padding_idx: 10
stop_on_perfect_val_exact_match: false

task_encoding:
  embedding_dim: 4
  value_vocab_size: 11
  use_sinusoidal_pe: false

# Flat (n_loops=1), matched to the "matched-scale" dim=4 target from
# arc1d_v2_hypernetwork_multitask -- not the older recipe's looped (n_loops=4) hidden_dim=16
# target.
target_model:
  name: rope_canon_looped_transformer
  params:
    hidden_dim: 4
    num_heads: 1
    inner_dim: 4
    inner_num_heads: 1
    n_loops: 1
    dropout: 0.1
    canon_set: ABCD
    canon_kernel: 5
    canon_activation: true
    canon_residual: true
    canon_causal: false
    use_block_skip: false
    use_loop_skip: false

# Plain (non-Zhu) rope_canon_transformer, matched-width to the dim=4 target -- not the older
# recipe's rope_canon_zhu_transformer/hidden_dim=64/8-layer encoder.
hyper_model:
  name: rope_canon_transformer
  params:
    hidden_dim: 4
    num_heads: 1
    num_layers: 1
    output_dim: 4
    canon_set: ABCD
    canon_kernel: 5
    canon_activation: true
    canon_residual: true
    canon_causal: false
    block_size: 2048

# Placeholder default: notd (no task-identity signal). Overridden per leaf for frozen_td.
hyper_head:
  pooling: attention
  bottleneck_dim: 8
  num_tasks: null
  freeze_task_indicator: false
  lora_adapter: false
