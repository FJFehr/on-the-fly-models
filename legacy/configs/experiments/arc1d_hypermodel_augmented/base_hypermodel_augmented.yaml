# Base config for augmented hypermodel experiments.
# Uses data/arc_1d_augmented (colour permutations + shifts, train only).
# Val/test read from the unaugmented dev/test splits.
#
# Self-contained (no _base_) because the config loader resolves only one
# level of inheritance; task-specific configs inherit from this file.
project_name: arc1d_hypermodel_augmented
entity: fjfehr
output_dir: outputs
seed: 42
experiment_name: aug_hyper_${task}_${model}
output_path: ${output_dir}/${project_name}/${experiment_name}

data: arc_1d_meta_multiclass
data_dir: data/arc_1d_augmented
model: hyper_model
primary_metric: val_loss
num_workers: 0
task_categories:
  - "1d_${task}"
task_ids: null
val_task_categories: null
train_split: train
val_split: val
test_split: test
overfit_single_batch: false

accelerator: auto
float32_matmul_precision: medium
precision: bf16-mixed
devices: 1
optimizer: RAdam
batch_size: 2048
learning_rate: 0.001
gradient_clip_val: 1.0
weight_decay: 0.01
lr_scheduler:
  name: CosineAnnealingLR
  params:
    T_max: ${max_steps}
    eta_min: 0.0001
max_steps: 10000
warmup_steps: 500
log_task_examples: true
log_task_examples_every_n_epochs: 100
num_periodic_train_task_examples: 100
num_periodic_val_task_examples: 100

prediction_task: multiclass
num_classes: 10
padding_idx: 10
stop_on_perfect_val_exact_match: false

task_encoding:
  embedding_dim: 16
  value_vocab_size: 11

hyper_model:
  name: transformer
  params:
    hidden_dim: 64
    num_heads: 4
    num_layers: 2
    output_dim: 64

hyper_head:
  pooling: hierarchical
  bottleneck_dim: 128
