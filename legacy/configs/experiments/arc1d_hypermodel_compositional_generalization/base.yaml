# Base config for the compositional-generalization experiment. Trains a hypernetwork on the
# same 15 in-distribution ARC-1D task categories as arc1d_hypermodel_looped_rope_canon_muon's
# notd/td/frozentd comparison, under the exact same recipe (Zhu backbone, Muon, lora_adapter_rank
# 4, max_steps 2000) -- see README.md for why, and for the held-out compositional evaluation this
# feeds into. Only the new held-out categories (never sampled during training) and frozen_td's
# num_tasks differ from that comparison; see notd.yaml/td.yaml/frozen_td.yaml.
#
# Architecture parity note: lora_adapter_rank=4 here, NOT the committed
# arc1d_hypermodel_looped_rope_canon_muon default of 8 -- matches
# arc1d_hypermodel_looped_rope_canon_vae_disentanglement's base.yaml, which itself matches the
# rank used in the original notd/td/frozentd comparison this experiment's recipe is copied from.
#
# Self-contained (no _base_ of its own), matching every sibling base.yaml, because the config
# loader only resolves one level of _base_ inheritance (training/config.py's load_config).
project_name: arc1d_hypermodel_compositional_generalization
entity: fjfehr
output_dir: outputs
seed: 42
experiment_name: looped_hyper_rope_canon_compositional_generalization
output_path: ${output_dir}/${project_name}/${experiment_name}

data: arc_1d_meta_multiclass
data_dir: data/arc_1d_looped_augmented
model: hyper_model
primary_metric: val_loss
num_workers: 0

task_categories:
  - 1d_denoising_1c
  - 1d_denoising_mc
  - 1d_fill
  - 1d_flip
  - 1d_hollow
  - 1d_mirror
  - 1d_move_1p
  - 1d_move_2p
  - 1d_move_2p_dp
  - 1d_move_3p
  - 1d_move_dp
  - 1d_pcopy_1c
  - 1d_pcopy_mc
  - 1d_recolor_cmp
  - 1d_scale_dp
task_ids: null
val_task_categories:
  - 1d_denoising_1c
  - 1d_denoising_mc
  - 1d_fill
  - 1d_flip
  - 1d_hollow
  - 1d_mirror
  - 1d_move_1p
  - 1d_move_2p
  - 1d_move_2p_dp
  - 1d_move_3p
  - 1d_move_dp
  - 1d_pcopy_1c
  - 1d_pcopy_mc
  - 1d_recolor_cmp
  - 1d_scale_dp
train_split: train
val_split: val
test_split: test
overfit_single_batch: false

accelerator: auto
float32_matmul_precision: medium
precision: bf16-mixed
devices: auto
optimizer: Muon
muon_lr: 0.005
muon_momentum: 0.95
batch_size: 512
learning_rate: 0.001
weight_decay: 0.01
gradient_clip_val: 10.0
lr_scheduler:
  name: CosineAnnealingLR
  params:
    T_max: ${max_steps}
    eta_min: 0.0001
max_steps: 2000
warmup_steps: 200
log_task_examples: true
log_task_examples_every_n_epochs: 100
num_periodic_train_task_examples: 100
num_periodic_val_task_examples: 100
log_embedding_clusters: true

prediction_task: multiclass
num_classes: 10
padding_idx: 10
stop_on_perfect_val_exact_match: false

N_supervision: 2

task_encoding:
  embedding_dim: 16
  value_vocab_size: 11
  use_sinusoidal_pe: false

target_model:
  name: rope_canon_looped_transformer
  params:
    hidden_dim: 16
    num_heads: 2
    inner_dim: 16
    inner_num_heads: 2
    n_loops: 4
    dropout: 0.1
    canon_set: ABCD
    canon_kernel: 5
    canon_activation: true
    canon_residual: true
    canon_causal: false
    use_block_skip: false
    use_loop_skip: false

# Fixed Zhu backbone, matching arc1d_hypermodel_looped_rope_canon_muon/vae_disentanglement.
hyper_model:
  name: rope_canon_zhu_transformer
  params:
    hidden_dim: 64
    num_heads: 4
    num_layers: 8
    output_dim: 64
    canon_set: ABCD
    canon_kernel: 5
    canon_activation: true
    canon_residual: true
    canon_causal: false
    block_size: 2048
    use_rmsnorm: true
    use_qk_norm: true
    use_swiglu: true

# Placeholder default: notd (no task-identity signal). Overridden per leaf for td/frozen_td.
hyper_head:
  pooling: attention
  bottleneck_dim: 128
  num_tasks: null
  freeze_task_indicator: false
  lora_adapter: true
  lora_adapter_rank: 4
  lora_adapter_zero_backbone: false
