# Canon ablation, at rank=8 only (the winning rank from the previous experiment), not swept
# across every rank: does removing Canon from the hypernetwork encoder make it worse? Encoder
# drops from 213,888 to 202,368 params without Canon (11,520 fewer, measured directly), not
# parameter-matched back up since this is a straightforward architecture-presence question,
# not asked to be size-controlled.
_base_: legacy/configs/experiments/arc1d_hypermodel_looped_rope_canon_rank_sweep/base.yaml
experiment_name: looped_hyper_rope_canon_rank_sweep_r8_no_canon

hyper_model:
  name: rope_canon_transformer
  params:
    hidden_dim: 64
    num_heads: 4
    num_layers: 4
    output_dim: 64
    canon_set: ""
    canon_kernel: 5
    canon_activation: true
    canon_residual: true
    canon_causal: false
    block_size: 2048

hyper_head:
  lora_adapter_rank: 8
