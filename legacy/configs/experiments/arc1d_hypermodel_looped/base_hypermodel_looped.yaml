# Base config for hypernetwork experiments targeting RoPECanonLoopedTransformer.
# Uses data/arc_1d_looped_augmented (per-pair augmentation: ~1000 variants per base
# task -- same recipe used by the capacity-ablation story), train split only.
# Val/test read from the unaugmented dev/test splits.
#
# Self-contained (no _base_) because the config loader resolves only one
# level of inheritance; task-specific configs inherit from this file.
#
# First run: single task category, no task descriptor (hyper_head.num_tasks
# unset), full MLP weight generation (hyper_head.low_rank_output unset/false).
# 1d_padded_fill is not part of this project -- it was never in the per-task
# arc1d_hypermodel_augmented configs this mirrors, only in the multi-task
# mixes/ and _td configs, which are out of scope here.
#
# max_steps/warmup_steps are compute-matched across N_supervision (see
# training/trainer.py: under manual optimization, Trainer(max_steps=...) is
# scaled by N_supervision internally, so max_steps here means "batches", and
# max_steps * N_supervision = total optimizer updates). This base's
# N_supervision=2 default uses max_steps=1000 -> 2000 total updates;
# configs overriding N_supervision to another value should scale max_steps
# to keep total updates at 2000 (e.g. N_supervision=4 -> max_steps=500).
# warmup_steps is 10% of max_steps in every case.
project_name: arc1d_hypermodel_looped
entity: fjfehr
output_dir: outputs
seed: 42
experiment_name: looped_hyper_${task}_${model}
output_path: ${output_dir}/${project_name}/${experiment_name}

data: arc_1d_meta_multiclass
data_dir: data/arc_1d_looped_augmented
model: hyper_model
primary_metric: val_loss
num_workers: 0
task_categories:
  - "1d_${task}"
task_ids: null
val_task_categories: null
train_split: train
val_split: val
test_split: test
overfit_single_batch: false

accelerator: auto
float32_matmul_precision: medium
precision: bf16-mixed
devices: 1
optimizer: RAdam
batch_size: 512
learning_rate: 0.001
weight_decay: 0.01
lr_scheduler:
  name: CosineAnnealingLR
  params:
    T_max: ${max_steps}
    eta_min: 0.0001
max_steps: 1000
warmup_steps: 100
log_task_examples: true
log_task_examples_every_n_epochs: 100
num_periodic_train_task_examples: 100
num_periodic_val_task_examples: 100

prediction_task: multiclass
num_classes: 10
padding_idx: 10
stop_on_perfect_val_exact_match: false

N_supervision: 2

task_encoding:
  embedding_dim: 16
  value_vocab_size: 11

hyper_model:
  name: transformer
  params:
    hidden_dim: 64
    num_heads: 4
    num_layers: 2
    output_dim: 64

hyper_head:
  pooling: hierarchical
  bottleneck_dim: 128
