_base_: legacy/configs/experiments/arc1d_recursion_ablation/base_ablation.yaml
# Condition C: plain transformer, 4 optimizer steps per batch (training recursion only).
# max_steps=1000 × N_supervision=4 = 4 000 total optimizer steps (matches A and B).
experiment_name: ablation_C_denoising1c_looped_transformer
task_categories:
  - 1d_denoising_1c
model: looped_supervised
N_supervision: 4
learning_rate: 0.00025
max_steps: 1000
backbone_model:
  name: transformer
  params:
    hidden_dim: 256
    num_layers: 2
    num_heads: 4
    dropout: 0.1
