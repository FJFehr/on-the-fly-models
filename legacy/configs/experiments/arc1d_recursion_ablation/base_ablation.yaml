# Base config for the recursion ablation study.
# 4-way comparison: architectural recursion vs training recursion vs both vs neither.
# All conditions use the same backbone size (hidden_dim=256, 2 layers, 4 heads)
# and the same total optimizer-step budget (4 000 steps).
#
# Conditions A and B: max_steps=4000 (1 optimizer step per training step)
# Conditions C and D: max_steps=1000 (N_supervision=4 steps per training step → 4 000 total)
project_name: arc1d_recursion_ablation
entity: fjfehr
output_dir: outputs
seed: 42
experiment_name: ${experiment_name}
logging_name: ${experiment_name}
output_path: ${output_dir}/${project_name}/${experiment_name}

data: arc_1d_direct
data_dir: data/arc_1d_looped_augmented
primary_metric: val_loss
stop_on_perfect_val_exact_match: false

task_categories: null
task_ids: null
val_task_categories: null
train_split: train
val_split: dev
test_split: test
overfit_single_batch: false

accelerator: auto
float32_matmul_precision: medium
devices: 1
num_workers: 1
optimizer: RAdam
batch_size: 256
learning_rate: 0.001
weight_decay: 0.01
warmup_steps: 200
lr_scheduler:
  name: CosineAnnealingLR
  params:
    T_max: ${max_steps}
    eta_min: 0.0
log_task_examples: true
log_task_examples_every_n_epochs: 200
non_background_loss_weight: 1.0

prediction_task: multiclass
num_classes: 10
padding_idx: 10

task_encoding:
  embedding_dim: 32
  value_vocab_size: 11
