# Arm 4 / "+RoPE+Canon": identical to hypernet_rope.yaml except canon_set="ABCD". Canon
# recipe values (canon_kernel/canon_activation/canon_residual/canon_causal) match
# hypernet_canon.yaml's, so arm 4 vs. arm 3 differs by exactly RoPE, not also by an
# unexplained canon_kernel mismatch.
_base_: legacy/configs/experiments/arc1d_hypermodel_looped_hypernet_rope_canon_ablation/base.yaml
experiment_name: looped_hyper_encoder_ablation_rope_canon

hyper_model:
  name: rope_canon_transformer
  params:
    hidden_dim: 64
    num_heads: 4
    num_layers: 2
    output_dim: 64
    canon_set: ABCD
    canon_kernel: 5
    canon_activation: true
    canon_residual: true
    canon_causal: false
    block_size: 2048

task_encoding:
  use_sinusoidal_pe: false
