# Pooling comparison arm: attention pooling instead of hierarchical. AttentionPooler has no
# depth/width knob of its own (fixed at ~hidden_dim params), so hyper_model.params.num_layers
# is bumped 2 -> 4 to roughly parameter-match hierarchical pooling's ~98.7K-param overhead
# (measured: arm_default totals 109,568 (encoder) + 98,752 (pooler) = 208,320; this arm totals
# 213,888 (encoder) + 64 (pooler) = 213,952, within 2.7%, see README.md for the full
# derivation, since AttentionPooler can't be shrunk further to close the gap exactly).
_base_: legacy/configs/experiments/arc1d_hypermodel_looped_rope_canon_followup/base.yaml
experiment_name: looped_hyper_rope_canon_followup_pooling_attention

hyper_model:
  name: rope_canon_transformer
  params:
    hidden_dim: 64
    num_heads: 4
    num_layers: 4
    output_dim: 64
    canon_set: ABCD
    canon_kernel: 5
    canon_activation: true
    canon_residual: true
    canon_causal: false
    block_size: 2048

hyper_head:
  pooling: attention
  bottleneck_dim: 128
  num_tasks: 18
  lora_adapter: true
  lora_adapter_rank: 1
