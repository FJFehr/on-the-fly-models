# Base config for the follow-up ablation on the RoPE+Canon hypernetwork encoder. The previous
# experiment (arc1d_hypermodel_looped_hypernet_rope_canon_ablation) varied encoder architecture
# and came back a bit inconclusive; this one fixes the encoder to RoPE+Canon (the strongest
# arm) as the default and opens three new single-axis comparisons on top of it: hierarchical
# vs. attention pooling, LoRA rank 1 vs. 8, and N_supervision 2 vs. 4. See README.md for the
# arms table and the parameter-matching/compute-matching reasoning.
#
# Unlike the previous ablation, hyper_model CAN live here directly: every arm in this
# experiment uses the same class (rope_canon_transformer), so there's no risk of a shared
# default leaking an incompatible kwarg into a different-shaped constructor. Only the pooling
# arm overrides hyper_model.params.num_layers (2 -> 4, to roughly parameter-match the
# hierarchical pooler's overhead, see README.md).
#
# batch_size dropped back to 512 (1024 was too large, per Fabio). gradient_clip_val carried
# forward from arc1d_hypermodel_looped_hypernet_rope_canon_ablation/base.yaml, where it was
# added after loss-spike diagnostics traced periodic spikes to unclipped hyper-projection/
# LoRA-adapter gradients (not re-verified at this batch size, flagged in README.md).
#
# Self-contained (no _base_ of its own) because the config loader only resolves one level of
# _base_ inheritance (training/config.py), same reason every sibling base.yaml is
# self-contained.
project_name: arc1d_hypermodel_looped_rope_canon_followup
entity: fjfehr
output_dir: outputs
seed: 42
experiment_name: looped_hyper_rope_canon_followup
output_path: ${output_dir}/${project_name}/${experiment_name}

data: arc_1d_meta_multiclass
data_dir: data/arc_1d_looped_augmented
model: hyper_model
primary_metric: val_loss
num_workers: 0

task_categories:
  - 1d_denoising_1c
  - 1d_denoising_mc
  - 1d_fill
  - 1d_flip
  - 1d_hollow
  - 1d_mirror
  - 1d_move_1p
  - 1d_move_2p
  - 1d_move_2p_dp
  - 1d_move_3p
  - 1d_move_dp
  - 1d_pcopy_1c
  - 1d_pcopy_mc
  - 1d_recolor_cmp
  - 1d_recolor_cnt
  - 1d_recolor_oe
  - 1d_scale_dp
task_ids: null
val_task_categories:
  - 1d_denoising_1c
  - 1d_denoising_mc
  - 1d_fill
  - 1d_flip
  - 1d_hollow
  - 1d_mirror
  - 1d_move_1p
  - 1d_move_2p
  - 1d_move_2p_dp
  - 1d_move_3p
  - 1d_move_dp
  - 1d_pcopy_1c
  - 1d_pcopy_mc
  - 1d_recolor_cmp
  - 1d_recolor_cnt
  - 1d_recolor_oe
  - 1d_scale_dp
train_split: train
val_split: val
test_split: test
overfit_single_batch: false

# Use all GPUs on the node (train.py resolves "auto" -> all free GPUs, see
# resolve_free_gpus in training/gpu_utils.py), matching sibling conventions.
accelerator: auto
float32_matmul_precision: medium
precision: bf16-mixed
devices: auto
optimizer: RAdam
batch_size: 512
learning_rate: 0.001
weight_decay: 0.01
# Carried forward from arc1d_hypermodel_looped_hypernet_rope_canon_ablation/base.yaml's
# loss-spike diagnostics (normal steps p50=6.2/p90=15.9, spikes reached 40-90+), tuned at
# batch_size=1024, not re-verified at 512.
gradient_clip_val: 10.0
lr_scheduler:
  name: CosineAnnealingLR
  params:
    T_max: ${max_steps}
    eta_min: 0.0001
# N_supervision=2 default; max_steps/warmup_steps follow the repo's compute-matching
# convention (max_steps * N_supervision held to a fixed total-optimizer-updates budget,
# warmup_steps = 10% of max_steps). arm_nsup4.yaml overrides all three together.
max_steps: 4000
warmup_steps: 400
log_task_examples: true
log_task_examples_every_n_epochs: 100
num_periodic_train_task_examples: 100
num_periodic_val_task_examples: 100

prediction_task: multiclass
num_classes: 10
padding_idx: 10
stop_on_perfect_val_exact_match: false

N_supervision: 2

task_encoding:
  embedding_dim: 16
  value_vocab_size: 11
  # Every arm's encoder has its own RoPE now (the encoder is fixed to rope_canon_transformer
  # across all arms), so this no longer needs to vary per arm the way it did in the previous
  # ablation.
  use_sinusoidal_pe: false

# Fixed across all 4 arms. Exact match to
# arc1d_hypermodel_looped_hypernet_rope_canon_ablation/base.yaml's target_model block.
target_model:
  name: rope_canon_looped_transformer
  params:
    hidden_dim: 16
    num_heads: 2
    inner_dim: 16
    inner_num_heads: 2
    n_loops: 4
    dropout: 0.1
    canon_set: ABCD
    canon_kernel: 5
    canon_activation: true
    canon_residual: true
    canon_causal: false
    use_block_skip: false
    use_loop_skip: false

# Fixed hypernetwork-encoder default: RoPE+Canon, num_layers=2, matching
# arc1d_hypermodel_looped_hypernet_rope_canon_ablation/hypernet_rope_canon.yaml exactly.
# arm_pooling_attention.yaml overrides params.num_layers to 4 (parameter-matching, see
# README.md); every other arm uses this unmodified.
hyper_model:
  name: rope_canon_transformer
  params:
    hidden_dim: 64
    num_heads: 4
    num_layers: 2
    output_dim: 64
    canon_set: ABCD
    canon_kernel: 5
    canon_activation: true
    canon_residual: true
    canon_causal: false
    block_size: 2048

# Default arm settings: hierarchical pooling, lora_adapter rank 1. arm_pooling_attention.yaml
# overrides pooling; arm_rank8.yaml overrides lora_adapter_rank.
hyper_head:
  pooling: hierarchical
  bottleneck_dim: 128
  num_tasks: 18
  lora_adapter: true
  lora_adapter_rank: 1
