# Base config for the v2-scale rerun of the leave-one-task-out generalization experiment
# (arc1d_hypermodel_looped_rope_canon_generalization): same 5-held-out-category x
# {notd,td,frozentd} grid and the same task_categories/val_task_categories mechanism (each leaf
# drops exactly one of the 15 categories from training while validating on the full 15, so
# results.txt's per-category breakdown reports the held-out category's zero-shot score in the
# same run as the 14 in-distribution scores) -- see that experiment's README.md for the full
# rationale and how to read results.
#
# Architecture is the "matched-scale" recipe from arc1d_v2_hypernetwork_multitask's sizing sweep
# (shrink_matched_dim4.yaml): 10,156 total params -- a 1,398-param dim=4 target generated by a
# fully size-matched hypernetwork (encoder hidden_dim=4/num_layers=1/output_dim=4,
# bottleneck_dim=8, dense generation, no LoRA), the SAME architecture as
# arc1d_v2_compositional_generalization uses. Not the original experiment's ~1.58M-param "Zhu
# backbone" recipe, and not the dim=4 main-grid config's larger (~200K-param, encoder
# hidden_dim=32/num_layers=2) hypernetwork -- an earlier version of this experiment used that
# main-grid size under the name arc1d_v2_looped_generalization; renamed and resized here to (a)
# drop "looped" now that n_loops=1 (no actual looping happens -- "looped" only describes the
# rope_canon_looped_transformer class, used flat throughout the v2 story) and (b) match
# arc1d_v2_compositional_generalization's architecture exactly, so the two v2-scale
# generalization experiments are directly comparable.
#
# No checkpoint needed here (unlike the compositional-generalization experiments): the held-out
# category's zero-shot score comes from this run's own validation loop, not a separate eval
# script against a saved checkpoint, so save_checkpoints stays false as in its v2 source.
#
# Self-contained (no _base_ of its own), matching every sibling base.yaml, because the config
# loader only resolves one level of _base_ inheritance (training/config.py's load_config).
project_name: arc1d_v2_generalization
entity: fjfehr
output_dir: outputs
seed: 42
experiment_name: v2_generalization
output_path: ${output_dir}/${project_name}/${experiment_name}

data: arc_1d_meta_multiclass
data_dir: data/arc_1d_looped_augmented
model: hyper_model
primary_metric: val_loss
num_workers: 0

# Placeholders -- overridden per leaf (see arm_*.yaml). 14 categories (1d_recolor_cmp dropped,
# matching the main v2 story's convention -- not the original experiment's 15), same
# per-held-out-category mechanism as arc1d_hypermodel_looped_rope_canon_generalization.
task_categories:
  - 1d_denoising_1c
  - 1d_denoising_mc
  - 1d_fill
  - 1d_flip
  - 1d_hollow
  - 1d_mirror
  - 1d_move_1p
  - 1d_move_2p
  - 1d_move_2p_dp
  - 1d_move_3p
  - 1d_move_dp
  - 1d_pcopy_1c
  - 1d_pcopy_mc
  - 1d_scale_dp
task_ids: null
val_task_categories:
  - 1d_denoising_1c
  - 1d_denoising_mc
  - 1d_fill
  - 1d_flip
  - 1d_hollow
  - 1d_mirror
  - 1d_move_1p
  - 1d_move_2p
  - 1d_move_2p_dp
  - 1d_move_3p
  - 1d_move_dp
  - 1d_pcopy_1c
  - 1d_pcopy_mc
  - 1d_scale_dp
train_split: train
val_split: val
test_split: test
overfit_single_batch: false

accelerator: auto
float32_matmul_precision: medium
precision: bf16-mixed
devices: 1
save_checkpoints: false

optimizer: Muon
muon_lr: 0.005
muon_momentum: 0.95
batch_size: 512
learning_rate: 0.001
weight_decay: 0.01
gradient_clip_val: 10.0
lr_scheduler:
  name: CosineAnnealingLR
  params:
    T_max: ${max_steps}
    eta_min: 0.0001
max_steps: 8000
warmup_steps: 800
N_supervision: 1

log_task_examples: true
log_task_examples_every_n_epochs: 100
num_periodic_train_task_examples: 100
num_periodic_val_task_examples: 100

prediction_task: multiclass
num_classes: 10
padding_idx: 10
stop_on_perfect_val_exact_match: false

task_encoding:
  embedding_dim: 4
  value_vocab_size: 11
  use_sinusoidal_pe: false

# dim=4 target -- flat (n_loops=1), 1,398 params. "rope_canon_looped_transformer" is just the
# class name (it supports n_loops>1, unused here) -- not the original experiment's actually-
# looped (n_loops=4) hidden_dim=16 target.
target_model:
  name: rope_canon_looped_transformer
  params:
    hidden_dim: 4
    num_heads: 1
    inner_dim: 4
    inner_num_heads: 1
    n_loops: 1
    dropout: 0.1
    canon_set: ABCD
    canon_kernel: 5
    canon_activation: true
    canon_residual: true
    canon_causal: false
    use_block_skip: false
    use_loop_skip: false

# Plain (non-Zhu) rope_canon_transformer, matched-width to the dim=4 target -- same
# "matched-scale" encoder as arc1d_v2_compositional_generalization, not the dim=4 main-grid's
# larger hidden_dim=32/num_layers=2 encoder, and not this experiment's original
# rope_canon_zhu_transformer/hidden_dim=64/8-layer encoder.
hyper_model:
  name: rope_canon_transformer
  params:
    hidden_dim: 4
    num_heads: 1
    num_layers: 1
    output_dim: 4
    canon_set: ABCD
    canon_kernel: 5
    canon_activation: true
    canon_residual: true
    canon_causal: false
    block_size: 2048

# Placeholder default: notd. Overridden per leaf for td/frozen_td.
hyper_head:
  pooling: attention
  bottleneck_dim: 8
  num_tasks: null
  freeze_task_indicator: false
  lora_adapter: false
