# Base config for Experiment 3: minimal data augmentation.
#
# Same variants_per_base_task data-reduction axis as arc1d_lowdata_baseline,
# but rebased onto RC1 (RoPE + Canon, dim=10, flat n_loops=1, N_sup=1,
# direct_supervised, Muon) -- the actual Phase 1 minimal recipe
# (docs/arc1d_story/06_phase1_findings.md), not the older
# arc1d_lowdata_baseline/base.yaml recipe (looped_supervised, hidden_dim=16,
# n_loops=4, N_supervision=2), which predates Phase 1's findings.
#
# One model per task category, per data level, per seed -- no cross-task
# sharing. 14-task set (1d_recolor_cmp excluded, see 06_phase1_findings.md).
# variants_per_base_task=1000 (full pool, no cap) is already covered by
# Phase 1's RC1 runs (configs/experiments/arc1d_v2_backbone_capacity/) --
# not rerun here. This sweep covers {500, 300, 100, 10} below that.
#
# Self-contained (no _base_ of its own), matching arc1d_lowdata_baseline's
# convention -- the config loader only resolves one level of _base_
# inheritance (training/config.py), so settings that would otherwise come
# from arc1d_recursion_ablation/base_ablation.yaml are inlined directly.
project_name: arc1d_v2_minimal_data
entity: fjfehr
output_dir: outputs
seed: 42
experiment_name: ${experiment_name}
logging_name: ${experiment_name}
output_path: ${output_dir}/${project_name}/${experiment_name}

data: arc_1d_direct
data_dir: data/arc_1d_looped_augmented
model: direct_supervised
primary_metric: val_loss
stop_on_perfect_val_exact_match: false
num_workers: 1
save_checkpoints: false

task_categories: null
task_ids: null
val_task_categories: null
train_split: train
val_split: dev
test_split: test
overfit_single_batch: false

accelerator: auto
float32_matmul_precision: medium
devices: 1
optimizer: Muon
muon_lr: 0.005
muon_momentum: 0.95
batch_size: 256
learning_rate: 0.0005
weight_decay: 0.01
lr_scheduler:
  name: CosineAnnealingLR
  params:
    T_max: ${max_steps}
    eta_min: 0.0
max_steps: 8000
warmup_steps: 200
log_task_examples: true
log_task_examples_every_n_epochs: 200
non_background_loss_weight: 1.0

prediction_task: multiclass
num_classes: 10
padding_idx: 10

# variants_per_base_task is a placeholder here, overridden per leaf (see {category}/v*.yaml).
variants_per_base_task: null
data_seed: 42

task_encoding:
  embedding_dim: 10
  value_vocab_size: 11
  use_sinusoidal_pe: false

backbone_model:
  name: rope_canon_looped_transformer
  params:
    hidden_dim: 10
    num_heads: 1
    inner_dim: 10
    inner_num_heads: 1
    n_loops: 1
    dropout: 0.1
    canon_set: ABCD
    canon_kernel: 5
    canon_activation: true
    canon_residual: true
    canon_causal: false
    use_block_skip: false
    use_loop_skip: false
