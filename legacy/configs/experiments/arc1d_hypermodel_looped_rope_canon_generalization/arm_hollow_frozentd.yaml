# Held out: 1d_hollow (sibling(s) remaining in training: 1d_fill)
# Variant: frozentd -- One-hot task-identity embedding present but frozen at random init for every category, trained or not, so the held-out category's column is drawn from the same distribution the rest of the network learned to interpret, not the one column that never moved while its 17 siblings did.
_base_: legacy/configs/experiments/arc1d_hypermodel_looped_rope_canon_generalization/base.yaml
experiment_name: looped_hyper_rope_canon_generalization_hollow_frozentd

task_categories:
  - 1d_denoising_1c
  - 1d_denoising_mc
  - 1d_fill
  - 1d_flip
  - 1d_mirror
  - 1d_move_1p
  - 1d_move_2p
  - 1d_move_2p_dp
  - 1d_move_3p
  - 1d_move_dp
  - 1d_pcopy_1c
  - 1d_pcopy_mc
  - 1d_recolor_cmp
  - 1d_scale_dp
val_task_categories:
  - 1d_denoising_1c
  - 1d_denoising_mc
  - 1d_fill
  - 1d_flip
  - 1d_hollow
  - 1d_mirror
  - 1d_move_1p
  - 1d_move_2p
  - 1d_move_2p_dp
  - 1d_move_3p
  - 1d_move_dp
  - 1d_pcopy_1c
  - 1d_pcopy_mc
  - 1d_recolor_cmp
  - 1d_scale_dp

hyper_head:
  num_tasks: 18
  freeze_task_indicator: true
