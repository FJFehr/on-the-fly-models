    hidden_dim: 10
    num_heads: 1
    inner_dim: 10
    inner_num_heads: 1
    n_loops: 8
    dropout: 0.1
    canon_set: ABCD
    canon_kernel: 5
    canon_activation: true
    canon_residual: true
    canon_causal: false
    use_block_skip: true
    use_loop_skip: false
