_base_: legacy/configs/experiments/arc1d_recursion_ablation/base_ablation.yaml
experiment_name: v2_B8_dim10_1d_recolor_cmp_n8_block_skip
project_name: arc1d_v2_backbone_capacity
task_categories:
- 1d_recolor_cmp
save_checkpoints: false
model: looped_supervised
optimizer: Muon
muon_lr: 0.005
muon_momentum: 0.95
learning_rate: 0.0005
N_supervision: 2
max_steps: 4000
task_encoding:
  embedding_dim: 10
  value_vocab_size: 11
  use_sinusoidal_pe: false
backbone_model:
