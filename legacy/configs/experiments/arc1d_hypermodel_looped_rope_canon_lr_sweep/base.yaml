# Base config for the LR sweep. Fork of
# arc1d_hypermodel_looped_rope_canon_optimizer/arm_adamw.yaml's exact resolved settings
# (AdamW, layers=8, no task descriptor, 8000-step training, clip=10, 15-task list), which
# gave a real, clean improvement over the RAdam/lr=0.001 baseline last round (mean
# exact-match 0.792 vs 0.713, tighter variance, every AdamW seed's val_loss beating every
# baseline seed's). Per Fabio's direction, AdamW is being kept (not re-litigated here); this
# experiment asks how low the LR should go, crossed with whether the full combined Zhu block
# (arm_zhu_all: RMSNorm + QK-norm + SwiGLU, mean 0.808 across only 3 seeds, the best mean of
# anything tried so far but with one seed below baseline and no clean diagnostic explanation
# why) holds up or improves with more seeds and a proper LR sweep.
#
# hyper_model (architecture) and learning_rate are placeholders here, both fully overridden
# per leaf (see arm_*.yaml): 2 architectures (baseline vs. zhu_all, which adds
# use_rmsnorm/use_qk_norm/use_swiglu on top, see the hyper_model block below for why) x 4
# learning rates (1e-3, 5e-4, 1e-4, 5e-5) = 8 cells. One cell (baseline,
# lr=5e-4) is exactly arc1d_hypermodel_looped_rope_canon_optimizer/arm_adamw.yaml, already
# has 3 seeds, so there is no arm_baseline_lr5e-4.yaml here, it is topped up to 5 seeds
# in place instead of duplicated. See README.md for the full grid and run instructions.
#
# Self-contained (no _base_ of its own), matching every sibling base.yaml, because the config
# loader only resolves one level of _base_ inheritance (training/config.py).
project_name: arc1d_hypermodel_looped_rope_canon_lr_sweep
entity: fjfehr
output_dir: outputs
seed: 42
experiment_name: looped_hyper_rope_canon_lr_sweep
output_path: ${output_dir}/${project_name}/${experiment_name}

data: arc_1d_meta_multiclass
data_dir: data/arc_1d_looped_augmented
model: hyper_model
primary_metric: val_loss
num_workers: 0

task_categories:
  - 1d_denoising_1c
  - 1d_denoising_mc
  - 1d_fill
  - 1d_flip
  - 1d_hollow
  - 1d_mirror
  - 1d_move_1p
  - 1d_move_2p
  - 1d_move_2p_dp
  - 1d_move_3p
  - 1d_move_dp
  - 1d_pcopy_1c
  - 1d_pcopy_mc
  - 1d_recolor_cmp
  - 1d_scale_dp
task_ids: null
val_task_categories:
  - 1d_denoising_1c
  - 1d_denoising_mc
  - 1d_fill
  - 1d_flip
  - 1d_hollow
  - 1d_mirror
  - 1d_move_1p
  - 1d_move_2p
  - 1d_move_2p_dp
  - 1d_move_3p
  - 1d_move_dp
  - 1d_pcopy_1c
  - 1d_pcopy_mc
  - 1d_recolor_cmp
  - 1d_scale_dp
train_split: train
val_split: val
test_split: test
overfit_single_batch: false

accelerator: auto
float32_matmul_precision: medium
precision: bf16-mixed
devices: auto
optimizer: AdamW
batch_size: 512
learning_rate: 0.0005
weight_decay: 0.01
gradient_clip_val: 10.0
lr_scheduler:
  name: CosineAnnealingLR
  params:
    T_max: ${max_steps}
    eta_min: 0.0001
max_steps: 8000
warmup_steps: 800
log_task_examples: true
log_task_examples_every_n_epochs: 100
num_periodic_train_task_examples: 100
num_periodic_val_task_examples: 100

prediction_task: multiclass
num_classes: 10
padding_idx: 10
stop_on_perfect_val_exact_match: false

N_supervision: 2

task_encoding:
  embedding_dim: 16
  value_vocab_size: 11
  use_sinusoidal_pe: false

target_model:
  name: rope_canon_looped_transformer
  params:
    hidden_dim: 16
    num_heads: 2
    inner_dim: 16
    inner_num_heads: 2
    n_loops: 4
    dropout: 0.1
    canon_set: ABCD
    canon_kernel: 5
    canon_activation: true
    canon_residual: true
    canon_causal: false
    use_block_skip: false
    use_loop_skip: false

# Placeholder default: plain rope_canon_transformer (the baseline architecture), no
# use_rmsnorm/use_qk_norm/use_swiglu keys. OmegaConf deep-merges hyper_model.params, so a
# leaf's override only ADDS/OVERRIDES keys, it can never REMOVE a key already present here --
# if this placeholder carried the three Zhu flag keys, every baseline leaf's merged params
# would still carry them too (even though it re-specifies the rest of the block), crashing
# RoPECanonTransformer.__init__ with an unexpected-kwarg TypeError (confirmed directly: this
# was tried and failed during implementation). Keeping this placeholder key-set-minimal means
# baseline leaves (same key-set) merge safely, and zhu_all leaves safely ADD the three new
# flag keys on top when they also switch hyper_model.name to rope_canon_zhu_transformer.
hyper_model:
  name: rope_canon_transformer
  params:
    hidden_dim: 64
    num_heads: 4
    num_layers: 8
    output_dim: 64
    canon_set: ABCD
    canon_kernel: 5
    canon_activation: true
    canon_residual: true
    canon_causal: false
    block_size: 2048

hyper_head:
  pooling: attention
  bottleneck_dim: 128
  num_tasks: null
  lora_adapter: true
  lora_adapter_rank: 8
  lora_adapter_zero_backbone: false
