# Base config for the "tricks from Zhu" follow-up. Fork of
# arc1d_hypermodel_looped_rope_canon_capacity_baseline/arm_layers8_notd_long.yaml's exact
# resolved settings (layers=8, no task descriptor, 8000-step training, clip=10, 15-task
# list), the strongest no-descriptor setting found so far (0.738 mean exact-match, seeds
# still completing) and the reference baseline for this experiment (reused, not rerun).
#
# Tests hyper_model.name: rope_canon_transformer -> rope_canon_zhu_transformer, a new
# hypernetwork-encoder class (models/rope_looped_transformer.py) that adds three independent,
# optional "tricks" on top of the existing RoPE+Canon(ABCD) block: RMSNorm instead of
# LayerNorm, QK-norm (per-head RMSNorm on Q/K before RoPE rotation), and a SwiGLU MLP instead
# of GELU. "Zhu" is Zeyuan Allen-Zhu, the author of the Canon Layers paper this repo's Canon
# mechanism is already based on (models/canon_layer.py cites "Physics of Language Models:
# Part 4.1, Architecture Design and the Magic of Canon Layers", NeurIPS 2025). Its own
# position docstring already anticipated a SwiGLU FFN for Canon-D, never actually built until
# now. All three flags default to False, in which case rope_canon_zhu_transformer reproduces
# rope_canon_transformer's exact behaviour (verified directly during implementation).
#
# use_rmsnorm/use_qk_norm/use_swiglu are placeholders here, overridden per leaf (see
# arm_*.yaml), each of the three sub-tricks is isolated into its own arm, plus one arm with
# all three combined, per Fabio's direction, so it's possible to see which one(s) actually
# help rather than only testing them as one bundled change.
#
# Optimizer/LR stay at the original RAdam/0.001 throughout (not combined with
# arc1d_hypermodel_looped_rope_canon_optimizer's change, so this stays a clean comparison
# against the known baseline).
#
# Self-contained (no _base_ of its own), matching every sibling base.yaml, because the config
# loader only resolves one level of _base_ inheritance (training/config.py).
project_name: arc1d_hypermodel_looped_rope_canon_zhu_block
entity: fjfehr
output_dir: outputs
seed: 42
experiment_name: looped_hyper_rope_canon_zhu_block
output_path: ${output_dir}/${project_name}/${experiment_name}

data: arc_1d_meta_multiclass
data_dir: data/arc_1d_looped_augmented
model: hyper_model
primary_metric: val_loss
num_workers: 0

task_categories:
  - 1d_denoising_1c
  - 1d_denoising_mc
  - 1d_fill
  - 1d_flip
  - 1d_hollow
  - 1d_mirror
  - 1d_move_1p
  - 1d_move_2p
  - 1d_move_2p_dp
  - 1d_move_3p
  - 1d_move_dp
  - 1d_pcopy_1c
  - 1d_pcopy_mc
  - 1d_recolor_cmp
  - 1d_scale_dp
task_ids: null
val_task_categories:
  - 1d_denoising_1c
  - 1d_denoising_mc
  - 1d_fill
  - 1d_flip
  - 1d_hollow
  - 1d_mirror
  - 1d_move_1p
  - 1d_move_2p
  - 1d_move_2p_dp
  - 1d_move_3p
  - 1d_move_dp
  - 1d_pcopy_1c
  - 1d_pcopy_mc
  - 1d_recolor_cmp
  - 1d_scale_dp
train_split: train
val_split: val
test_split: test
overfit_single_batch: false

accelerator: auto
float32_matmul_precision: medium
precision: bf16-mixed
devices: auto
optimizer: RAdam
batch_size: 512
learning_rate: 0.001
weight_decay: 0.01
gradient_clip_val: 10.0
lr_scheduler:
  name: CosineAnnealingLR
  params:
    T_max: ${max_steps}
    eta_min: 0.0001
max_steps: 8000
warmup_steps: 800
log_task_examples: true
log_task_examples_every_n_epochs: 100
num_periodic_train_task_examples: 100
num_periodic_val_task_examples: 100

prediction_task: multiclass
num_classes: 10
padding_idx: 10
stop_on_perfect_val_exact_match: false

N_supervision: 2

task_encoding:
  embedding_dim: 16
  value_vocab_size: 11
  use_sinusoidal_pe: false

target_model:
  name: rope_canon_looped_transformer
  params:
    hidden_dim: 16
    num_heads: 2
    inner_dim: 16
    inner_num_heads: 2
    n_loops: 4
    dropout: 0.1
    canon_set: ABCD
    canon_kernel: 5
    canon_activation: true
    canon_residual: true
    canon_causal: false
    use_block_skip: false
    use_loop_skip: false

hyper_model:
  name: rope_canon_zhu_transformer
  params:
    hidden_dim: 64
    num_heads: 4
    num_layers: 8
    output_dim: 64
    canon_set: ABCD
    canon_kernel: 5
    canon_activation: true
    canon_residual: true
    canon_causal: false
    block_size: 2048
    use_rmsnorm: false
    use_qk_norm: false
    use_swiglu: false

hyper_head:
  pooling: attention
  bottleneck_dim: 128
  num_tasks: null
  lora_adapter: true
  lora_adapter_rank: 8
  lora_adapter_zero_backbone: false
