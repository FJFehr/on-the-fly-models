# Base config for the layers x clip x task-descriptor grid, following on from
# arc1d_hypermodel_looped_rope_canon_mechanism_ablation's finding: re-isolating
# gradient_clip_val (5 vs 10) alone (holding num_layers=4, attention pooling) recovered most
# of the gap between the followup experiment's strong rank=8 result and the rank_sweep
# experiment's weaker one (0.746 -> 0.837 mean val_query_exact_match), while pooling alone
# barely moved it (0.746 -> 0.773). But a THIRD, previously-unexamined difference
# (hyper_model.num_layers: 2 in the followup experiment vs. 4 in every experiment since) was
# never isolated, so layers and clip may interact rather than act independently. This
# experiment runs the full layers x clip grid to find out, and crosses in the
# mechanism_ablation's other strong finding (removing the task descriptor cost ~0.12 exact
# match) across every cell, since that effect might also depend on layers/clip rather than
# being constant.
#
# hyper_model.params.num_layers in {2, 4, 8}, gradient_clip_val in {5, 10, 20}, and
# hyper_head.num_tasks in {18, null} are ALL overridden per leaf config
# (scripts/gen_hypermodel_looped_rope_canon_grid_configs.py generates all 18 combinations);
# the values set here are just placeholders so this file is independently valid.
#
# No hierarchical pooling this round, confirmed in the followup experiment (no benefit) and
# again in the mechanism_ablation experiment (barely moved the needle, higher variance);
# attention pooling only. rank=8 fixed (confirmed the winning rank in the rank_sweep
# experiment), RoPE+Canon fixed (confirmed needed in the rank_sweep experiment's
# rank8_no_canon arm).
#
# Self-contained (no _base_ of its own), matching every sibling base.yaml, because the config
# loader only resolves one level of _base_ inheritance (training/config.py).
project_name: arc1d_hypermodel_looped_rope_canon_grid
entity: fjfehr
output_dir: outputs
seed: 42
experiment_name: looped_hyper_rope_canon_grid
output_path: ${output_dir}/${project_name}/${experiment_name}

data: arc_1d_meta_multiclass
data_dir: data/arc_1d_looped_augmented
model: hyper_model
primary_metric: val_loss
num_workers: 0

task_categories:
  - 1d_denoising_1c
  - 1d_denoising_mc
  - 1d_fill
  - 1d_flip
  - 1d_hollow
  - 1d_mirror
  - 1d_move_1p
  - 1d_move_2p
  - 1d_move_2p_dp
  - 1d_move_3p
  - 1d_move_dp
  - 1d_pcopy_1c
  - 1d_pcopy_mc
  - 1d_recolor_cmp
  - 1d_recolor_cnt
  - 1d_recolor_oe
  - 1d_scale_dp
task_ids: null
val_task_categories:
  - 1d_denoising_1c
  - 1d_denoising_mc
  - 1d_fill
  - 1d_flip
  - 1d_hollow
  - 1d_mirror
  - 1d_move_1p
  - 1d_move_2p
  - 1d_move_2p_dp
  - 1d_move_3p
  - 1d_move_dp
  - 1d_pcopy_1c
  - 1d_pcopy_mc
  - 1d_recolor_cmp
  - 1d_recolor_cnt
  - 1d_recolor_oe
  - 1d_scale_dp
train_split: train
val_split: val
test_split: test
overfit_single_batch: false

# Use all GPUs on the node (train.py resolves "auto" -> all free GPUs, see
# resolve_free_gpus in training/gpu_utils.py), matching sibling conventions.
accelerator: auto
float32_matmul_precision: medium
precision: bf16-mixed
devices: auto
optimizer: RAdam
batch_size: 512
learning_rate: 0.001
weight_decay: 0.01
# Placeholder, overridden per leaf (5, 10, or 20). See header comment.
gradient_clip_val: 10.0
lr_scheduler:
  name: CosineAnnealingLR
  params:
    T_max: ${max_steps}
    eta_min: 0.0001
max_steps: 4000
warmup_steps: 400
log_task_examples: true
log_task_examples_every_n_epochs: 100
num_periodic_train_task_examples: 100
num_periodic_val_task_examples: 100

prediction_task: multiclass
num_classes: 10
padding_idx: 10
stop_on_perfect_val_exact_match: false

# Fixed at 2: no benefit found from 4 in the followup experiment.
N_supervision: 2

task_encoding:
  embedding_dim: 16
  value_vocab_size: 11
  use_sinusoidal_pe: false

# Fixed across every cell.
target_model:
  name: rope_canon_looped_transformer
  params:
    hidden_dim: 16
    num_heads: 2
    inner_dim: 16
    inner_num_heads: 2
    n_loops: 4
    dropout: 0.1
    canon_set: ABCD
    canon_kernel: 5
    canon_activation: true
    canon_residual: true
    canon_causal: false
    use_block_skip: false
    use_loop_skip: false

# RoPE+Canon encoder fixed; num_layers is a placeholder, overridden per leaf (2, 4, or 8).
hyper_model:
  name: rope_canon_transformer
  params:
    hidden_dim: 64
    num_heads: 4
    num_layers: 4
    output_dim: 64
    canon_set: ABCD
    canon_kernel: 5
    canon_activation: true
    canon_residual: true
    canon_causal: false
    block_size: 2048

# Attention pooling only, rank=8 fixed. num_tasks is a placeholder, overridden per leaf
# (18 or null).
hyper_head:
  pooling: attention
  bottleneck_dim: 128
  num_tasks: 18
  lora_adapter: true
  lora_adapter_rank: 8
  lora_adapter_zero_backbone: false
