# Full-training cosine anneal: kl_beta_warmup_steps=4000 spans the ENTIRE scaled training run
# (max_steps=2000 * N_supervision=2 = 4000), not just the first 10% like the earlier
# beta*_anneal.yaml configs (kl_beta_warmup_steps=400). Those reached the full target beta by
# step 400 and held it constant for the remaining 90% of training -- effectively "constant
# beta training, started 400 steps late" -- which is why beta10_anneal still diverged once it
# reached full strength. This variant instead keeps beta below its target for the whole run,
# only reaching kl_beta exactly at the final step.
_base_: legacy/configs/experiments/arc1d_hypermodel_looped_rope_canon_vae_disentanglement/base.yaml
experiment_name: looped_hyper_rope_canon_vae_disentanglement_beta1e-4_annealfull

kl_beta: 0.0001
kl_beta_anneal: cosine
kl_beta_warmup_steps: 4000
