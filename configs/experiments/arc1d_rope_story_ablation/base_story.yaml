# Base config for arc1d_rope_story_ablation.
# Three new conditions (S3, S4, S5) that bridge the gap between the plain transformer
# (arc1d_recursion_ablation) and the full Canon+skip model. All use RoPE and no Canon,
# progressively adding looped middle and wide middle.
project_name: arc1d_rope_story_ablation
entity: fjfehr
output_dir: outputs
seed: 42
experiment_name: ${experiment_name}
logging_name: ${experiment_name}
output_path: ${output_dir}/${project_name}/${experiment_name}

data: arc_1d_direct
data_dir: data/arc_1d_looped_augmented
primary_metric: val_loss
stop_on_perfect_val_exact_match: false

task_categories: null
task_ids: null
val_task_categories: null
train_split: train
val_split: dev
test_split: test
overfit_single_batch: false

accelerator: auto
float32_matmul_precision: medium
devices: 1
num_workers: 1
optimizer: RAdam
batch_size: 256
learning_rate: 0.0005
weight_decay: 0.01
warmup_steps: 200
lr_scheduler:
  name: CosineAnnealingLR
  params:
    T_max: ${max_steps}
    eta_min: 0.0
log_task_examples: true
log_task_examples_every_n_epochs: 200
non_background_loss_weight: 1.0

prediction_task: multiclass
num_classes: 10
padding_idx: 10

model: looped_supervised
N_supervision: 2
max_steps: 4000

task_encoding:
  embedding_dim: 8
  value_vocab_size: 11
  use_sinusoidal_pe: false
