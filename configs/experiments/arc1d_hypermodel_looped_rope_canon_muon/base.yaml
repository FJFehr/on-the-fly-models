# Base config for the Muon-optimizer experiment. Back to standard in-distribution training
# (task_categories == val_task_categories, full 15-task list, no held-out axis) after the
# leave-one-task-out generalization experiment. Fixed backbone: Zhu block (RMSNorm + QK-norm +
# SwiGLU), AdamW/lr=0.001 as the placeholder default -- matches the current leader in
# arc1d_hypermodel_looped_rope_canon_lr_sweep's zhu_all arm (mean exact-match 0.8625 across 5
# seeds).
#
# This experiment's axes: task-identity conditioning (notd vs frozen_td, from the
# generalization experiment -- plain td is dropped, not needed once there's no held-out
# category to expose its weakness) crossed with optimizer (AdamW vs Muon,
# https://github.com/KellerJordan/Muon). Fabio's hypothesis: Muon may stabilise the notd runs
# specifically, since notd + the LoRA adapter parameterisation (hyper_head.lora_adapter: true)
# may be a harder optimization landscape than AdamW's per-parameter adaptive scaling handles
# well. See README.md for the full grid, the Muon/AdamW parameter split rationale
# (models/hypermodel_lightning.py's `_build_muon_param_groups`), and how to read results.
#
# hyper_head.num_tasks/freeze_task_indicator and optimizer/learning_rate/muon_lr/muon_momentum
# are placeholders here, overridden per leaf (see arm_*.yaml).
#
# max_steps=4000/warmup_steps=400 (half of every other rope_canon experiment's 8000/800):
# a GPU smoke run of arm_notd_muon hit several task categories at 1.0 exact match within the
# first 100 steps, prompting Fabio to try halving the schedule for a faster first pass. Note
# this isn't uniform across categories -- the fast-converging ones (denoising, pcopy) were
# already solved that early, but the harder ones (move family, flip, recolor_cmp) were still
# at 0.0 at 100/8000 steps, so halving isn't guaranteed lossless for those. All 4 arms in this
# experiment still run the same schedule as each other, so the AdamW-vs-Muon comparison stays
# apples-to-apples; it just isn't directly comparable to the 8000-step numbers from lr_sweep
# without accounting for the shorter schedule.
#
# Self-contained (no _base_ of its own), matching every sibling base.yaml, because the config
# loader only resolves one level of _base_ inheritance (training/config.py).
project_name: arc1d_hypermodel_looped_rope_canon_muon
entity: fjfehr
output_dir: outputs
seed: 42
experiment_name: looped_hyper_rope_canon_muon
output_path: ${output_dir}/${project_name}/${experiment_name}

data: arc_1d_meta_multiclass
data_dir: data/arc_1d_looped_augmented
model: hyper_model
primary_metric: val_loss
num_workers: 0

task_categories:
  - 1d_denoising_1c
  - 1d_denoising_mc
  - 1d_fill
  - 1d_flip
  - 1d_hollow
  - 1d_mirror
  - 1d_move_1p
  - 1d_move_2p
  - 1d_move_2p_dp
  - 1d_move_3p
  - 1d_move_dp
  - 1d_pcopy_1c
  - 1d_pcopy_mc
  - 1d_recolor_cmp
  - 1d_scale_dp
task_ids: null
val_task_categories:
  - 1d_denoising_1c
  - 1d_denoising_mc
  - 1d_fill
  - 1d_flip
  - 1d_hollow
  - 1d_mirror
  - 1d_move_1p
  - 1d_move_2p
  - 1d_move_2p_dp
  - 1d_move_3p
  - 1d_move_dp
  - 1d_pcopy_1c
  - 1d_pcopy_mc
  - 1d_recolor_cmp
  - 1d_scale_dp
train_split: train
val_split: val
test_split: test
overfit_single_batch: false

accelerator: auto
float32_matmul_precision: medium
precision: bf16-mixed
devices: auto
optimizer: AdamW
batch_size: 512
learning_rate: 0.001
weight_decay: 0.01
gradient_clip_val: 10.0
lr_scheduler:
  name: CosineAnnealingLR
  params:
    T_max: ${max_steps}
    eta_min: 0.0001
max_steps: 4000
warmup_steps: 400
log_task_examples: true
log_task_examples_every_n_epochs: 100
num_periodic_train_task_examples: 100
num_periodic_val_task_examples: 100
log_embedding_clusters: true

prediction_task: multiclass
num_classes: 10
padding_idx: 10
stop_on_perfect_val_exact_match: false

N_supervision: 2

task_encoding:
  embedding_dim: 16
  value_vocab_size: 11
  use_sinusoidal_pe: false

target_model:
  name: rope_canon_looped_transformer
  params:
    hidden_dim: 16
    num_heads: 2
    inner_dim: 16
    inner_num_heads: 2
    n_loops: 4
    dropout: 0.1
    canon_set: ABCD
    canon_kernel: 5
    canon_activation: true
    canon_residual: true
    canon_causal: false
    use_block_skip: false
    use_loop_skip: false

# Fixed Zhu backbone across every arm in this experiment (RMSNorm + QK-norm + SwiGLU all on).
hyper_model:
  name: rope_canon_zhu_transformer
  params:
    hidden_dim: 64
    num_heads: 4
    num_layers: 8
    output_dim: 64
    canon_set: ABCD
    canon_kernel: 5
    canon_activation: true
    canon_residual: true
    canon_causal: false
    block_size: 2048
    use_rmsnorm: true
    use_qk_norm: true
    use_swiglu: true

# Placeholder default: notd (no task-identity signal). Overridden per leaf for frozen_td.
hyper_head:
  pooling: attention
  bottleneck_dim: 128
  num_tasks: null
  freeze_task_indicator: false
  lora_adapter: true
  lora_adapter_rank: 8
  lora_adapter_zero_backbone: false
