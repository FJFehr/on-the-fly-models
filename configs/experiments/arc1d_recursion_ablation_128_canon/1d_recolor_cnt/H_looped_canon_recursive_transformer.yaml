_base_: configs/experiments/arc1d_recursion_ablation/base_ablation.yaml
experiment_name: ablation_H_1d_recolor_cnt_looped_canon_recursive_transformer
project_name: arc1d_recursion_ablation_128_canon
task_categories:
- 1d_recolor_cnt
model: looped_supervised
N_supervision: 2
learning_rate: 0.0005
max_steps: 4000
backbone_model:
  name: canon_recursive_transformer
  params:
    hidden_dim: 128
    num_layers: 1
    num_heads: 4
    n_loops: 2
    dropout: 0.1
    canon_set: ABCD
    canon_kernel: 4
    canon_activation: true
    canon_residual: true
    canon_causal: false
