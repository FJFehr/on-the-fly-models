# Base config for the beta-VAE disentanglement experiment. Tests whether KL regularization
# alone can force disentanglement between task categories in "notd" mode (no explicit
# task-identity descriptor) -- see README.md for the full motivation and how to read results.
#
# Follows on directly from arc1d_hypermodel_looped_rope_canon_muon_diag's notd/td/frozentd
# comparison (seed=1, Muon, lora_adapter_rank=4, max_steps=2000): notd scored 73.3%
# linear-probe accuracy / 82.5% val_query_exact_match there, vs. 100% / ~97% for td and
# frozentd (identical to each other -- frozen stays the default, no further td-vs-frozentd
# work planned). This experiment asks: can a beta-VAE bottleneck on the pooled task
# representation close that gap without ever telling the model which task it is?
#
# Architecture/schedule parity with that comparison: Zhu block backbone, Muon
# (muon_lr=0.005, muon_momentum=0.95), lora_adapter_rank=4 (NOT the committed
# arc1d_hypermodel_looped_rope_canon_muon default of 8), max_steps=2000/warmup_steps=200, 15
# in-distribution task categories, hyper_head.num_tasks: null (notd only -- no td/frozentd
# arm this round), single seed (seed=1, see scripts/run_hypermodel_vae_disentanglement.sh).
# Only the new hyper_head.variational/kl_beta axis differs.
#
# project_name intentionally REUSES arc1d_hypermodel_looped_rope_canon_muon_diag (not a new
# project) so these 6 runs land in the same W&B dashboard as the earlier notd/td/frozentd
# comparison and are directly comparable.
#
# Self-contained (no _base_ of its own), matching every sibling base.yaml, because the config
# loader only resolves one level of _base_ inheritance (training/config.py's load_config).
project_name: arc1d_hypermodel_looped_rope_canon_muon_diag
entity: fjfehr
output_dir: outputs
seed: 42
experiment_name: looped_hyper_rope_canon_vae_disentanglement
output_path: ${output_dir}/${project_name}/${experiment_name}

data: arc_1d_meta_multiclass
data_dir: data/arc_1d_looped_augmented
model: hyper_model
primary_metric: val_loss
num_workers: 0

task_categories:
  - 1d_denoising_1c
  - 1d_denoising_mc
  - 1d_fill
  - 1d_flip
  - 1d_hollow
  - 1d_mirror
  - 1d_move_1p
  - 1d_move_2p
  - 1d_move_2p_dp
  - 1d_move_3p
  - 1d_move_dp
  - 1d_pcopy_1c
  - 1d_pcopy_mc
  - 1d_recolor_cmp
  - 1d_scale_dp
task_ids: null
val_task_categories:
  - 1d_denoising_1c
  - 1d_denoising_mc
  - 1d_fill
  - 1d_flip
  - 1d_hollow
  - 1d_mirror
  - 1d_move_1p
  - 1d_move_2p
  - 1d_move_2p_dp
  - 1d_move_3p
  - 1d_move_dp
  - 1d_pcopy_1c
  - 1d_pcopy_mc
  - 1d_recolor_cmp
  - 1d_scale_dp
train_split: train
val_split: val
test_split: test
overfit_single_batch: false

accelerator: auto
float32_matmul_precision: medium
precision: bf16-mixed
devices: auto
optimizer: Muon
muon_lr: 0.005
muon_momentum: 0.95
batch_size: 512
learning_rate: 0.001
weight_decay: 0.01
gradient_clip_val: 10.0
lr_scheduler:
  name: CosineAnnealingLR
  params:
    T_max: ${max_steps}
    eta_min: 0.0001
max_steps: 2000
warmup_steps: 200
log_task_examples: true
log_task_examples_every_n_epochs: 100
num_periodic_train_task_examples: 100
num_periodic_val_task_examples: 100
log_embedding_clusters: true

prediction_task: multiclass
num_classes: 10
padding_idx: 10
stop_on_perfect_val_exact_match: false

N_supervision: 2

task_encoding:
  embedding_dim: 16
  value_vocab_size: 11
  use_sinusoidal_pe: false

target_model:
  name: rope_canon_looped_transformer
  params:
    hidden_dim: 16
    num_heads: 2
    inner_dim: 16
    inner_num_heads: 2
    n_loops: 4
    dropout: 0.1
    canon_set: ABCD
    canon_kernel: 5
    canon_activation: true
    canon_residual: true
    canon_causal: false
    use_block_skip: false
    use_loop_skip: false

# Fixed Zhu backbone, matching arc1d_hypermodel_looped_rope_canon_muon.
hyper_model:
  name: rope_canon_zhu_transformer
  params:
    hidden_dim: 64
    num_heads: 4
    num_layers: 8
    output_dim: 64
    canon_set: ABCD
    canon_kernel: 5
    canon_activation: true
    canon_residual: true
    canon_causal: false
    block_size: 2048
    use_rmsnorm: true
    use_qk_norm: true
    use_swiglu: true

# notd fixed for every arm (no td/frozentd arm this round -- see README.md). variational: true
# enables HyperModel's mu/logvar heads on the pooled task representation (see
# models/hypermodel.py's _apply_variational_bottleneck). kl_beta is a placeholder here,
# overridden per leaf (beta*.yaml).
hyper_head:
  pooling: attention
  bottleneck_dim: 128
  num_tasks: null
  freeze_task_indicator: false
  lora_adapter: true
  lora_adapter_rank: 4
  lora_adapter_zero_backbone: false
  variational: true

kl_beta: 1.0
