project_name: arc1d_hypermodel_disentanglement
entity: fjfehr
output_dir: outputs
seed: 42
experiment_name: disentangle_${task}_rnn
output_path: ${output_dir}/${project_name}/${experiment_name}

data: arc_1d_meta_multiclass
data_dir: data/arc_1d_move_augmented
model: hyper_model
primary_metric: val_loss
num_workers: 0
task_ids: null
val_task_categories: null
train_split: train
val_split: val
test_split: test
overfit_single_batch: false

accelerator: auto
float32_matmul_precision: medium
precision: bf16-mixed
devices: auto
optimizer: RAdam
batch_size: 2048
learning_rate: 0.001
gradient_clip_val: 1.0
weight_decay: 0.01
lr_scheduler:
  name: CosineAnnealingLR
  params:
    T_max: ${max_steps}
    eta_min: 0.0001
max_steps: 2000
warmup_steps: 200
log_task_examples: true
log_task_examples_every_n_epochs: 100
num_periodic_train_task_examples: 100
num_periodic_val_task_examples: 100

prediction_task: multiclass
num_classes: 10
padding_idx: 10
stop_on_perfect_val_exact_match: false

task_encoding:
  embedding_dim: 16
  value_vocab_size: 11

hyper_model:
  name: transformer
  params:
    hidden_dim: 64
    num_heads: 4
    num_layers: 2
    output_dim: 64

# 16-dim bottleneck forces the task representation through a tight code —
# the key disentanglement probe. Compare against mix runs to measure conflation.
hyper_head:
  pooling: hierarchical
  projection_dims: [16] # [16, 256, 512, 1024]

target_model:
  name: rnn
  params:
    hidden_dim: 22
    num_layers: 2
    bidirectional: true
    activation: silu
    dropout: 0.0
    use_residual: true
