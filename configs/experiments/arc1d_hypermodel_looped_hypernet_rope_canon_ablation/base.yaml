# Base config for the hypernetwork-ENCODER ablation: 4 arms varying only hyper_model (the
# encoder that reads the 3 support examples) while target_model is held IDENTICAL across
# every arm -- the opposite axis from arc1d_hypermodel_looped_lora_adapter, which varies
# weight-generation mode with a fixed encoder. See README.md for the arms table and the
# task_encoding.use_sinusoidal_pe reasoning.
#
# target_model/hyper_head/task_encoding.{embedding_dim,value_vocab_size} live here because
# they are byte-identical across all 4 arms (target_model = rope_canon_looped_transformer,
# matching arc1d_hypermodel_looped_lora_adapter/base_n2_loop4_noskip.yaml's target_model
# block exactly; hyper_head is unaffected by which encoder produces hyper_output_dim=64,
# which every arm produces alike).
#
# hyper_model is deliberately OMITTED here -- unlike target_model, hyper_model.params has a
# DIFFERENT SHAPE per arm (Transformer takes no canon_set/canon_kernel; CanonTransformer and
# RoPECanonTransformer do). If a shared default leaked through OmegaConf's deep merge (e.g.
# base.yaml setting hyper_model.params.canon_set), it would crash Transformer(**resolved_params)
# with an unexpected-kwarg TypeError. Each of the 4 leaf configs therefore supplies its OWN
# complete hyper_model block. task_encoding.use_sinusoidal_pe is also omitted here for the
# same reason it's the other ablated axis: arms 1/3 (no internal encoder RoPE) need it at its
# true default; arms 2/4 (encoder has its own RoPE) set it false. embedding_dim/
# value_vocab_size ARE shared here since they're plain non-overlapping subkeys of the same
# task_encoding dict, not a differently-shaped structure.
#
# Self-contained (no _base_ of its own) because the config loader only resolves one level of
# _base_ inheritance (training/config.py) -- same reason every sibling base.yaml is
# self-contained.
project_name: arc1d_hypermodel_looped_hypernet_rope_canon_ablation
entity: fjfehr
output_dir: outputs
seed: 42
experiment_name: looped_hyper_encoder_ablation
output_path: ${output_dir}/${project_name}/${experiment_name}

data: arc_1d_meta_multiclass
data_dir: data/arc_1d_looped_augmented
model: hyper_model
primary_metric: val_loss
num_workers: 0

task_categories:
  - 1d_denoising_1c
  - 1d_denoising_mc
  - 1d_fill
  - 1d_flip
  - 1d_hollow
  - 1d_mirror
  - 1d_move_1p
  - 1d_move_2p
  - 1d_move_2p_dp
  - 1d_move_3p
  - 1d_move_dp
  - 1d_pcopy_1c
  - 1d_pcopy_mc
  - 1d_recolor_cmp
  - 1d_recolor_cnt
  - 1d_recolor_oe
  - 1d_scale_dp
task_ids: null
val_task_categories:
  - 1d_denoising_1c
  - 1d_denoising_mc
  - 1d_fill
  - 1d_flip
  - 1d_hollow
  - 1d_mirror
  - 1d_move_1p
  - 1d_move_2p
  - 1d_move_2p_dp
  - 1d_move_3p
  - 1d_move_dp
  - 1d_pcopy_1c
  - 1d_pcopy_mc
  - 1d_recolor_cmp
  - 1d_recolor_cnt
  - 1d_recolor_oe
  - 1d_scale_dp
train_split: train
val_split: val
test_split: test
overfit_single_batch: false

# Use all GPUs on the node (train.py resolves "auto" -> all free GPUs, see
# resolve_free_gpus in training/gpu_utils.py), matching the arc1d_hypermodel_looped_lora_adapter
# convention.
accelerator: auto
float32_matmul_precision: medium
precision: bf16-mixed
devices: auto
optimizer: RAdam
batch_size: 1024
learning_rate: 0.001
weight_decay: 0.01
# Loss-spike diagnostics (scripts/analyze_loss_spikes.py on a seed=1 diagnostic run) traced
# periodic training-loss spikes to unclipped gradient explosions in the hyper-projection/
# rank-1 LoRA-adapter heads (not the target-model loop): normal steps sit around p50=6.2,
# p90=15.9; spikes reached 40-90+. 10.0 sits between p75 (9.5) and p90 (15.9).
gradient_clip_val: 10.0
lr_scheduler:
  name: CosineAnnealingLR
  params:
    T_max: ${max_steps}
    eta_min: 0.0001
# Trains longer than arc1d_hypermodel_looped_lora_adapter/base_n2_loop4_noskip.yaml's
# max_steps=1000 -- Fabio's explicit direction for this ablation. warmup_steps stays at 10%
# of max_steps, matching that file's convention.
max_steps: 4000
warmup_steps: 400
log_task_examples: true
log_task_examples_every_n_epochs: 100
num_periodic_train_task_examples: 100
num_periodic_val_task_examples: 100

prediction_task: multiclass
num_classes: 10
padding_idx: 10
stop_on_perfect_val_exact_match: false

N_supervision: 2

task_encoding:
  embedding_dim: 16
  value_vocab_size: 11

# Fixed across all 4 arms -- the ablated axis is hyper_model, not target_model. Exact match
# to arc1d_hypermodel_looped_lora_adapter/base_n2_loop4_noskip.yaml's target_model block.
target_model:
  name: rope_canon_looped_transformer
  params:
    hidden_dim: 16
    num_heads: 2
    inner_dim: 16
    inner_num_heads: 2
    n_loops: 4
    dropout: 0.1
    canon_set: ABCD
    canon_kernel: 5
    canon_activation: true
    canon_residual: true
    canon_causal: false
    use_block_skip: false
    use_loop_skip: false

# Fixed across all 4 arms. lora_adapter_rank is fixed at 1 (not swept) -- the mechanism is
# reused as-is from arc1d_hypermodel_looped_lora_adapter, not re-validated here.
hyper_head:
  pooling: hierarchical
  bottleneck_dim: 128
  num_tasks: 18
  lora_adapter: true
  lora_adapter_rank: 1
