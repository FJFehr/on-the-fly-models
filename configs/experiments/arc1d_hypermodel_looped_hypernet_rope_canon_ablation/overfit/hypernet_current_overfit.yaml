# Smoke test: confirm gradients flow and loss drops on a single overfit batch before
# launching the full sweep. Mirrors arc1d_hypermodel_looped_lora_adapter/overfit/
# lora_adapter_overfit.yaml's pattern.
#
# Points _base_ directly at base.yaml (NOT at hypernet_current.yaml) -- the config loader
# only resolves one level of _base_, so chaining overfit -> hypernet_current.yaml ->
# base.yaml would silently drop base.yaml's target_model/hyper_head/task_categories. The
# hyper_model block below is therefore a deliberate duplicate of hypernet_current.yaml's own
# hyper_model block -- keep them in sync if either changes.
_base_: configs/experiments/arc1d_hypermodel_looped_hypernet_rope_canon_ablation/base.yaml
experiment_name: looped_hyper_encoder_ablation_current_overfit

hyper_model:
  name: transformer
  params:
    hidden_dim: 64
    num_heads: 4
    num_layers: 2
    output_dim: 64

task_encoding:
  use_sinusoidal_pe: true

hyper_head:
  lora_adapter_rank: 4

task_categories:
  - 1d_move_1p
val_task_categories:
  - 1d_move_1p
task_ids:
  - 8
train_split: train
val_split: train
test_split: train
overfit_single_batch: true

accelerator: cpu
precision: 32
float32_matmul_precision: high
num_workers: 0
devices: 1

batch_size: 1
learning_rate: 0.01
weight_decay: 0.0
gradient_clip_val: 0.0
warmup_steps: 0
max_steps: 500
lr_scheduler:
  name: CosineAnnealingLR
  params:
    T_max: 500
    eta_min: 0.0001
log_task_examples: false
