# Smoke test for arm 2. See hypernet_current_overfit.yaml for why _base_ points directly at
# base.yaml rather than hypernet_rope.yaml (one-level _base_ resolution constraint).
_base_: configs/experiments/arc1d_hypermodel_looped_hypernet_rope_canon_ablation/base.yaml
experiment_name: looped_hyper_encoder_ablation_rope_overfit

hyper_model:
  name: rope_canon_transformer
  params:
    hidden_dim: 64
    num_heads: 4
    num_layers: 2
    output_dim: 64
    canon_set: ""
    canon_kernel: 5
    canon_activation: true
    canon_residual: true
    canon_causal: false
    block_size: 2048

task_encoding:
  use_sinusoidal_pe: false

hyper_head:
  lora_adapter_rank: 4

task_categories:
  - 1d_move_1p
val_task_categories:
  - 1d_move_1p
task_ids:
  - 8
train_split: train
val_split: train
test_split: train
overfit_single_batch: true

accelerator: cpu
precision: 32
float32_matmul_precision: high
num_workers: 0
devices: 1

batch_size: 1
learning_rate: 0.01
weight_decay: 0.0
gradient_clip_val: 0.0
warmup_steps: 0
max_steps: 500
lr_scheduler:
  name: CosineAnnealingLR
  params:
    T_max: 500
    eta_min: 0.0001
log_task_examples: false
