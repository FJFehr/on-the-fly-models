# Arm 3 / "+Canon ABCD": models.canon_transformer.CanonTransformer, num_layers=2 (matching
# arm 1's depth exactly). canon_kernel/canon_activation/canon_residual/canon_causal match
# the target model's own Canon recipe for consistency.
_base_: configs/experiments/arc1d_hypermodel_looped_hypernet_rope_canon_ablation/base.yaml
experiment_name: looped_hyper_encoder_ablation_canon

hyper_model:
  name: canon_transformer
  params:
    hidden_dim: 64
    num_heads: 4
    num_layers: 2
    output_dim: 64
    canon_set: ABCD
    canon_kernel: 5
    canon_activation: true
    canon_residual: true
    canon_causal: false
    block_size: 2048
    causal: false

task_encoding:
  # No internal RoPE in this encoder -- keeps the external sinusoidal PE it needs.
  use_sinusoidal_pe: true
