# Arm 1 / "current": exactly today's hyper_model convention (models/transformer.py's
# Transformer), unchanged. Baseline for the other 3 arms.
_base_: configs/experiments/arc1d_hypermodel_looped_hypernet_rope_canon_ablation/base.yaml
experiment_name: looped_hyper_encoder_ablation_current

hyper_model:
  name: transformer
  params:
    hidden_dim: 64
    num_heads: 4
    num_layers: 2
    output_dim: 64

task_encoding:
  # Explicit even though it matches TaskTokenEmbedder's own default, for symmetry/
  # auditability against the false arms below -- this encoder has no internal positional
  # mechanism and needs the shared embedder's additive sinusoidal PE.
  use_sinusoidal_pe: true
