_base_: configs/experiments/arc1d_binary/base.yaml
task: move_1p_denoising_1c

task_categories:
  - 1d_move_1p
  - 1d_denoising_1c

# Default to single-GPU; switch to `devices: auto` for multi-GPU.
accelerator: auto
devices: 1

log_task_examples: true
log_task_examples_every_n_epochs: 50
num_periodic_train_task_examples: 2
num_periodic_val_task_examples: 2

experiment_name: ${data}_${task}_${model}_scalar

task_encoding:
  name: scalar

hyper_model:
  name: transformer
  params:
    hidden_dim: 32
    num_heads: 1
    num_layers: 2
    output_dim: 32

target_model:
  name: rnn
  params:
    hidden_dim: 32
    bidirectional: true
    num_layers: 1
