_base_: configs/experiments/arc1d_binary/base.yaml
task: all_simple_tasks
variant: target_cnn

task_categories:
  - 1d_move_1p
  - 1d_move_2p
  - 1d_move_3p
  - 1d_fill
  - 1d_hollow
  - 1d_denoising_1c
  - 1d_pcopy_1c

# Default to single-GPU; switch to `devices: auto` for multi-GPU.
accelerator: auto
devices: 1

experiment_name: ${data}_${task}_${model}

hyper_model:
  name: transformer
  params:
    hidden_dim: 32
    num_heads: 1
    num_layers: 2
    output_dim: 32

target_model:
  name: cnn
  params:
    hidden_dim: 32
    num_layers: 2
    kernel_size: 3
