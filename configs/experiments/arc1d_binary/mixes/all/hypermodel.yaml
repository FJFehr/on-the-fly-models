_base_: configs/experiments/arc1d_binary/base.yaml
task: all_simple_tasks

task_categories:
  - 1d_move_1p
  - 1d_move_2p
  - 1d_move_3p
  - 1d_fill
  - 1d_hollow
  - 1d_denoising_1c
  - 1d_pcopy_1c

accelerator: auto
devices: 1

experiment_name: ${data}_${task}_${model}_shared_embeddings_bn8_radam_cosine
max_steps: 10000
num_periodic_val_task_examples: 3
log_task_examples_every_n_epochs: 100

stop_on_perfect_val_exact_match: false

task_encoding:
  name: shared_embeddings
  params:
    embedding_dim: 16
    share_input_embeddings: true

hyper_model:
  name: transformer
  params:
    hidden_dim: 32
    num_heads: 1
    num_layers: 2
    output_dim: 32
    # dropout: 0.1

target_model:
  name: rnn
  params:
    hidden_dim: 32
    bidirectional: true
    num_layers: 1

hyper_head:
  bottleneck_dim: 8
  # noise_std: 0.1 # This is too much. What about dropout. That would show more general representations

optimizer: RAdam
gradient_clip_val: 1.0

lr_scheduler:
  name: CosineAnnealingLR
  params:
    T_max: ${max_steps}
    eta_min: 0.00001
