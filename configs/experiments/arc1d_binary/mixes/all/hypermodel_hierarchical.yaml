_base_: configs/experiments/arc1d_binary/base.yaml
task: all

experiment_name: ${data}_${task}_${model}_hierarchical_pool

task_categories:
  - 1d_move_1p
  - 1d_move_2p
  - 1d_move_3p
  - 1d_fill
  - 1d_hollow
  - 1d_denoising_1c
  - 1d_pcopy_1c

val_task_categories:
  - 1d_move_1p
  - 1d_move_2p
  - 1d_move_3p
  - 1d_fill
  - 1d_hollow
  - 1d_denoising_1c
  - 1d_pcopy_1c

devices: 3
max_steps: 4000
log_task_examples_every_n_epochs: 400
optimizer: RAdam
gradient_clip_val: 1.0
batch_size: 64

hyper_model:
  name: transformer
  params:
    hidden_dim: 32
    num_heads: 1
    num_layers: 2
    output_dim: 32
    dropout: 0.1

target_model:
  name: rnn
  params:
    hidden_dim: 32
    bidirectional: true
    num_layers: 1

hyper_head:
  pooling: hierarchical
  bottleneck_dim: 16
