_base_: configs/experiments/arc1d_simple_meta_hypermodel/base.yaml
task: move_1p3p_validate_2p

task_categories:
  - 1d_move_1p
  - 1d_move_3p

val_task_categories:
  - 1d_move_2p

experiment_name: ${data}_${task}_${model}

hyper_model:
  name: transformer
  params:
    hidden_dim: 32
    num_heads: 1
    num_layers: 2
    output_dim: 32
    dropout: 0.1

target_model:
  name: rnn
  params:
    hidden_dim: 32
    bidirectional: true
    num_layers: 1
