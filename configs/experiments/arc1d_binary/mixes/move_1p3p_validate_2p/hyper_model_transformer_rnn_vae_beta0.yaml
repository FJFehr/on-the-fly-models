_base_: configs/experiments/arc1d_binary/base.yaml
task: move_1p3p_val_2p

task_categories:
  - 1d_move_1p
  - 1d_move_3p

val_task_categories:
  - 1d_move_1p
  - 1d_move_2p
  - 1d_move_3p

accelerator: auto
devices: 1

experiment_name: ${data}_${task}_${model}_vae_beta0

max_steps: 5000
num_periodic_val_task_examples: 3
log_task_examples_every_n_epochs: 100

stop_on_perfect_val_exact_match: false

task_encoding:
  name: shared_embeddings
  params:
    embedding_dim: 16
    share_input_embeddings: true

hyper_model:
  name: transformer
  params:
    hidden_dim: 32
    num_heads: 1
    num_layers: 2
    output_dim: 32
    dropout: 0.1

target_model:
  name: rnn
  params:
    hidden_dim: 32
    bidirectional: true
    num_layers: 1

hyper_head:
  bottleneck_dim: 2
  use_vae: true
  kl_weight: 0.0

optimizer: RAdam
gradient_clip_val: 1.0

lr_scheduler:
  name: CosineAnnealingLR
  params:
    T_max: ${max_steps}
    eta_min: 0.00001
