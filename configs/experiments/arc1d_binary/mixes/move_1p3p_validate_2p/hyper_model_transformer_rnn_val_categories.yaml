_base_: configs/experiments/arc1d_binary/base.yaml
task: move_1p3p

task_categories:
  - 1d_move_1p
  - 1d_move_3p

val_task_categories:
  - 1d_move_1p
  - 1d_move_3p

accelerator: auto
devices: 1

experiment_name: ${data}_${task}_${model}_scalar_embeddings_valcategories
max_steps: 5000
num_periodic_val_task_examples: 3
log_task_examples_every_n_epochs: 100

stop_on_perfect_val_exact_match: true

task_encoding:
  name: scalar

hyper_model:
  name: transformer
  params:
    hidden_dim: 32
    num_heads: 1
    num_layers: 2
    output_dim: 32

target_model:
  name: rnn
  params:
    hidden_dim: 32
    bidirectional: true
    num_layers: 1