_base_: configs/experiments/arc1d_binary/base.yaml
task: move_1p_hollow
variant: target_cnn

task_categories:
  - 1d_move_1p
  - 1d_hollow

# Default to single-GPU; switch to `devices: auto` for multi-GPU.
accelerator: auto
devices: 1

log_task_examples: true
log_task_examples_every_n_epochs: 50
num_periodic_train_task_examples: 2
num_periodic_val_task_examples: 2
stop_on_perfect_val_exact_match: true

experiment_name: ${data}_${task}_${model}_${variant}

hyper_model:
  name: transformer
  params:
    hidden_dim: 32
    num_heads: 1
    num_layers: 1
    output_dim: 32

target_model:
  name: cnn
  params:
    hidden_dim: 32
    num_layers: 1
    kernel_size: 3
