_base_: configs/experiments/arc1d_binary/base.yaml
task: move_1p
variant: target_cnn

# Default to single-GPU; switch to `devices: auto` for multi-GPU.
accelerator: auto
devices: 1

experiment_name: ${data}_${task}_${model}_${variant}

hyper_model:
  name: transformer
  params:
    hidden_dim: 32
    num_heads: 1
    num_layers: 2
    output_dim: 32

target_model:
  name: cnn
  params:
    hidden_dim: 32
    num_layers: 2
    kernel_size: 3
