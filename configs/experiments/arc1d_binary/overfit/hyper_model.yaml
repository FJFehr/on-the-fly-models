_base_: configs/experiments/arc1d_simple_meta_hypermodel/base.yaml
task: overfit
variant: single_task_8
experiment_name: ${data}_${task}_${model}_${variant}

task_categories:
  - 1d_move_1p
task_ids:
  - 8
train_split: train
val_split: train
test_split: train
overfit_single_batch: true
batch_size: 1
learning_rate: 0.01
weight_decay: 0.0
max_steps: 200
hyper_model:
  name: transformer
  params:
    hidden_dim: 32
    num_heads: 4
    num_layers: 2
    output_dim: 32
target_model:
  name: rnn
  params:
    hidden_dim: 32
    bidirectional: true
    num_layers: 1
