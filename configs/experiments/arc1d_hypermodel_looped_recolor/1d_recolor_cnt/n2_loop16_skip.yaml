_base_: configs/experiments/arc1d_hypermodel_looped/base_hypermodel_looped.yaml
task: recolor_cnt
experiment_name: looped_hyper_recolor_cnt_n2_loop16_skip
project_name: arc1d_hypermodel_looped_recolor
data_dir: data/arc_1d_looped_augmented
task_categories:
- 1d_recolor_cnt
val_task_categories:
- 1d_recolor_cnt
