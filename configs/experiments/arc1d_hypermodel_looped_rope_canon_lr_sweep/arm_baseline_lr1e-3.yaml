_base_: configs/experiments/arc1d_hypermodel_looped_rope_canon_lr_sweep/base.yaml
experiment_name: looped_hyper_rope_canon_lr_sweep_baseline_lr1e-3

learning_rate: 0.001

hyper_model:
  name: rope_canon_transformer
  params:
