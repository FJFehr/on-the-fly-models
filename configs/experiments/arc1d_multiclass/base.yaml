# Base config for the multiclass task-level HyperModel track.
project_name: arc1d_multiclass_meta_hypermodel_experiments
entity: fjfehr
output_dir: outputs
seed: 42
experiment_name: ${data}_${task}_${model}
output_path: ${output_dir}/${project_name}/${experiment_name}

data: arc_1d_meta_padded_multiclass
data_dir: data/arc_1d_padded_multiclass
model: hyper_model
primary_metric: val_query_exact_match
num_workers: 0
task_categories:
  - "1d_${task}"
task_ids: null
val_task_categories: null
train_split: train
val_split: val
test_split: test
overfit_single_batch: false

accelerator: auto
float32_matmul_precision: medium
devices: 1
optimizer: RAdam
batch_size: 16
learning_rate: 0.001
gradient_clip_val: 1.0
weight_decay: 0.01
max_steps: 10000
log_task_examples: true
log_task_examples_every_n_epochs: 50
num_periodic_train_task_examples: 100
num_periodic_val_task_examples: 100

input_dim: 33
output_dim: 33
prediction_task: multiclass
num_classes: 10
stop_on_perfect_val_exact_match: false

task_encoding:
  embedding_dim: 16
  value_vocab_size: 10
