_base_: configs/experiments/arc1d_multiclass/base.yaml
task: move_3p

experiment_name: ${data}_${task}_${model}

task_categories:
  - 1d_move_3p
  # - 1d_move_1p
  # - 1d_move_2p
  # - 1d_move_dp
  # - 1d_move_2p_dp
  # - 1d_fill
  # - 1d_hollow
  # - 1d_flip
  # - 1d_mirror
  # - 1d_denoising_1c
  # - 1d_denoising_mc
  # - 1d_pcopy_1c
  # - 1d_pcopy_mc
  # - 1d_recolor_oe
  # - 1d_recolor_cnt
  # - 1d_recolor_cmp
  # - 1d_scale_dp

val_task_categories:
  - 1d_move_3p
  # - 1d_move_1p
  # - 1d_move_2p
  # - 1d_move_dp
  # - 1d_move_2p_dp
  # - 1d_fill
  # - 1d_hollow
  # - 1d_flip
  # - 1d_mirror
  # - 1d_denoising_1c
  # - 1d_denoising_mc
  # - 1d_pcopy_1c
  # - 1d_pcopy_mc
  # - 1d_recolor_oe
  # - 1d_recolor_cnt
  # - 1d_recolor_cmp
  # - 1d_scale_dp

max_steps: 1000
log_task_examples_every_n_epochs: 200
optimizer: RAdam
gradient_clip_val: 1.0
batch_size: 32

stop_on_perfect_val_exact_match: true

hyper_model:
  name: transformer
  params:
    hidden_dim: 32
    num_heads: 1
    num_layers: 2
    output_dim: 32

target_model:
  name: rnn
  params:
    hidden_dim: 32
    bidirectional: true
    num_layers: 1

hyper_head:
  bottleneck_dim: 2
