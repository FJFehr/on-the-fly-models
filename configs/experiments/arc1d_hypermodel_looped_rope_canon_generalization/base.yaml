# Base config for the leave-one-task-out generalization experiment. Backbone is fixed to the
# Zhu block (RMSNorm + QK-norm + SwiGLU, arm_zhu_all from
# arc1d_hypermodel_looped_rope_canon_zhu_block), AdamW/lr=0.001 (the current leader in
# arc1d_hypermodel_looped_rope_canon_lr_sweep's zhu_all arm, mean 0.8625 across 5 seeds vs.
# 0.81 at lr=1e-4 and ~0.79 at 5e-4/5e-5). Per Fabio's direction, architecture and LR are not
# swept here -- this experiment's only axis is whether/how task-identity information reaches
# the model, tested against generalization to a task category held out of training entirely.
#
# task_categories (train) and val_task_categories (val/test) are placeholders here, overridden
# per leaf (see arm_*.yaml): each leaf drops exactly one of the 15 task categories from
# task_categories (the held-out task) while val_task_categories keeps the full 15-list, so
# results.txt's automatic per-category breakdown
# (val_query_exact_match_by_task_<category>) reports the held-out category's zero-shot score
# in the same run as the 14 in-distribution scores.
#
# hyper_head.num_tasks/freeze_task_indicator are placeholders too, overridden per leaf:
#   - notd:       num_tasks: null                                  (no task-identity signal at all)
#   - td:         num_tasks: 18, freeze_task_indicator: false       (learned one-hot embedding)
#   - frozen_td:  num_tasks: 18, freeze_task_indicator: true        (random one-hot embedding,
#                 frozen from init for every category, trained or not -- so a held-out
#                 category's column is drawn from the same distribution the rest of the
#                 network learned to interpret, not the one column that never moved while its
#                 17 siblings did)
#
# Self-contained (no _base_ of its own), matching every sibling base.yaml, because the config
# loader only resolves one level of _base_ inheritance (training/config.py).
project_name: arc1d_hypermodel_looped_rope_canon_generalization
entity: fjfehr
output_dir: outputs
seed: 42
experiment_name: looped_hyper_rope_canon_generalization
output_path: ${output_dir}/${project_name}/${experiment_name}

data: arc_1d_meta_multiclass
data_dir: data/arc_1d_looped_augmented
model: hyper_model
primary_metric: val_loss
num_workers: 0

task_categories:
  - 1d_denoising_1c
  - 1d_denoising_mc
  - 1d_fill
  - 1d_flip
  - 1d_hollow
  - 1d_mirror
  - 1d_move_1p
  - 1d_move_2p
  - 1d_move_2p_dp
  - 1d_move_3p
  - 1d_move_dp
  - 1d_pcopy_1c
  - 1d_pcopy_mc
  - 1d_recolor_cmp
  - 1d_scale_dp
task_ids: null
val_task_categories:
  - 1d_denoising_1c
  - 1d_denoising_mc
  - 1d_fill
  - 1d_flip
  - 1d_hollow
  - 1d_mirror
  - 1d_move_1p
  - 1d_move_2p
  - 1d_move_2p_dp
  - 1d_move_3p
  - 1d_move_dp
  - 1d_pcopy_1c
  - 1d_pcopy_mc
  - 1d_recolor_cmp
  - 1d_scale_dp
train_split: train
val_split: val
test_split: test
overfit_single_batch: false

accelerator: auto
float32_matmul_precision: medium
precision: bf16-mixed
devices: auto
optimizer: AdamW
batch_size: 512
learning_rate: 0.001
weight_decay: 0.01
gradient_clip_val: 10.0
lr_scheduler:
  name: CosineAnnealingLR
  params:
    T_max: ${max_steps}
    eta_min: 0.0001
max_steps: 8000
warmup_steps: 800
log_task_examples: true
log_task_examples_every_n_epochs: 100
num_periodic_train_task_examples: 100
num_periodic_val_task_examples: 100

prediction_task: multiclass
num_classes: 10
padding_idx: 10
stop_on_perfect_val_exact_match: false

N_supervision: 2

task_encoding:
  embedding_dim: 16
  value_vocab_size: 11
  use_sinusoidal_pe: false

target_model:
  name: rope_canon_looped_transformer
  params:
    hidden_dim: 16
    num_heads: 2
    inner_dim: 16
    inner_num_heads: 2
    n_loops: 4
    dropout: 0.1
    canon_set: ABCD
    canon_kernel: 5
    canon_activation: true
    canon_residual: true
    canon_causal: false
    use_block_skip: false
    use_loop_skip: false

# Fixed Zhu backbone across every arm in this experiment (RMSNorm + QK-norm + SwiGLU all on).
hyper_model:
  name: rope_canon_zhu_transformer
  params:
    hidden_dim: 64
    num_heads: 4
    num_layers: 8
    output_dim: 64
    canon_set: ABCD
    canon_kernel: 5
    canon_activation: true
    canon_residual: true
    canon_causal: false
    block_size: 2048
    use_rmsnorm: true
    use_qk_norm: true
    use_swiglu: true

# Placeholder default: notd (no task-identity signal). Overridden per leaf for td/frozen_td.
hyper_head:
  pooling: attention
  bottleneck_dim: 128
  num_tasks: null
  freeze_task_indicator: false
  lora_adapter: true
  lora_adapter_rank: 8
  lora_adapter_zero_backbone: false
