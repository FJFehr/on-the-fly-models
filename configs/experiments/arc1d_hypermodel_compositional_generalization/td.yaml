# Learned (not frozen) task-identity descriptor. num_tasks=18 matches every other td/frozen_td
# config in this codebase (models/hypermodel_lightning.py's TASK_CATEGORY_INDEX is a fixed
# registry of all 18 known ARC-1D categories, independent of which subset a given experiment's
# task_categories actually trains on).
#
# td is trained here for parity with the original notd/td/frozentd comparison, but is NOT
# evaluated on the held-out compositional set (see README.md): a learned one-hot embedding is
# undefined for a task index it never saw during training, unlike frozen_td's untrained
# projection, whose unused rows are just more random-but-fixed directions.
_base_: configs/experiments/arc1d_hypermodel_compositional_generalization/base.yaml
experiment_name: looped_hyper_rope_canon_compositional_generalization_td

hyper_head:
  num_tasks: 18
  freeze_task_indicator: false
