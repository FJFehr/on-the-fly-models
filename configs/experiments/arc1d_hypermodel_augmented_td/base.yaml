# Base config for augmented hypermodel experiments with task descriptors (td).
# Architecture: transformer hyper-model → hierarchical head with task IDs → rnn-32 target.
# Self-contained (no _base_) because the config loader resolves only one level of inheritance.
project_name: arc1d_hypermodel_augmented_td
entity: fjfehr
output_dir: outputs
seed: 42
experiment_name: aug_hyper_td
output_path: ${output_dir}/${project_name}/${experiment_name}

data: arc_1d_meta_multiclass
data_dir: data/arc_1d_all_tasks_augmented
model: hyper_model
primary_metric: val_loss
num_workers: 4
task_categories:
  - 1d_denoising_1c
  - 1d_denoising_mc
  - 1d_fill
  - 1d_flip
  - 1d_hollow
  - 1d_mirror
  - 1d_move_1p
  - 1d_move_2p
  - 1d_move_2p_dp
  - 1d_move_3p
  - 1d_move_dp
  - 1d_padded_fill
  - 1d_pcopy_1c
  - 1d_pcopy_mc
  - 1d_recolor_cmp
  - 1d_recolor_cnt
  - 1d_recolor_oe
  - 1d_scale_dp
task_ids: null
val_task_categories:
  - 1d_denoising_1c
  - 1d_denoising_mc
  - 1d_fill
  - 1d_flip
  - 1d_hollow
  - 1d_mirror
  - 1d_move_1p
  - 1d_move_2p
  - 1d_move_2p_dp
  - 1d_move_3p
  - 1d_move_dp
  - 1d_padded_fill
  - 1d_pcopy_1c
  - 1d_pcopy_mc
  - 1d_recolor_cmp
  - 1d_recolor_cnt
  - 1d_recolor_oe
  - 1d_scale_dp
train_split: train
val_split: val
test_split: test
overfit_single_batch: false

accelerator: auto
float32_matmul_precision: medium
precision: bf16-mixed
devices: auto
optimizer: RAdam
batch_size: 3072 # 2048+1024 which is divisible by 6 GPUs
learning_rate: 0.001
gradient_clip_val: 1.0
weight_decay: 0.01
lr_scheduler:
  name: CosineAnnealingLR
  params:
    T_max: ${max_steps}
    eta_min: 0.0001
max_steps: 5000
warmup_steps: 500
log_task_examples: true
log_task_examples_every_n_epochs: 100
num_periodic_train_task_examples: 100
num_periodic_val_task_examples: 100

prediction_task: multiclass
num_classes: 10
padding_idx: 10
stop_on_perfect_val_exact_match: false

task_encoding:
  embedding_dim: 16
  value_vocab_size: 11

hyper_model:
  name: transformer
  params:
    hidden_dim: 128
    num_heads: 8
    num_layers: 4
    output_dim: 128

hyper_head:
  pooling: hierarchical
  projection_dims: [256, 512, 1024]
  num_tasks: 18

target_model:
  name: rnn
  params:
    hidden_dim: 22
    num_layers: 2
    bidirectional: true
    activation: silu
    dropout: 0.0
    use_residual: true
