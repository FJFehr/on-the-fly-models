# 11-task multi-task hypernetwork mix with a one-hot task descriptor.
#
# Reuses the "simple" 11-task subset from arc1d_hypermodel_augmented_td/rnn_simple_td.yaml,
# targeting rope_canon_looped_transformer at the new winning capacity settings from the
# flip+recolor sweep (arc1d_hypermodel_looped_recolor): n_loops=8, N_supervision=4, block+
# loop skip on.
#
# Task descriptor (hyper_head.num_tasks) is enabled from the start, not as a fallback: the
# repo's own arc1d_hypermodel_disentanglement experiments already showed structurally
# similar task mixes (e.g. move variants together) fail outright without one, and this
# 11-task subset includes three move variants (1d_move_1p, 1d_move_2p_dp, 1d_move_dp).
_base_: configs/experiments/arc1d_hypermodel_looped/base_hypermodel_looped.yaml
experiment_name: looped_hyper_mix11_td
project_name: arc1d_hypermodel_looped_mix11

task_categories:
  - 1d_denoising_1c
  - 1d_denoising_mc
  - 1d_fill
  - 1d_hollow
  - 1d_mirror
  - 1d_move_1p
  - 1d_move_2p_dp
  - 1d_move_dp
  - 1d_pcopy_1c
  - 1d_pcopy_mc
  - 1d_scale_dp
task_ids: null
val_task_categories:
  - 1d_denoising_1c
  - 1d_denoising_mc
  - 1d_fill
  - 1d_hollow
  - 1d_mirror
  - 1d_move_1p
  - 1d_move_2p_dp
  - 1d_move_dp
  - 1d_pcopy_1c
  - 1d_pcopy_mc
  - 1d_scale_dp

N_supervision: 4

target_model:
  name: rope_canon_looped_transformer
  params:
    hidden_dim: 16
    num_heads: 2
    inner_dim: 16
    inner_num_heads: 2
    n_loops: 8
    dropout: 0.1
    canon_set: ABCD
    canon_kernel: 5
    canon_activation: true
    canon_residual: true
    canon_causal: false
    use_block_skip: true
    use_loop_skip: true

hyper_head:
  pooling: hierarchical
  bottleneck_dim: 128
  num_tasks: 18
