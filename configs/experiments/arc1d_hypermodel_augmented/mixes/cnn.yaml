project_name: arc1d_hypermodel_augmented
entity: fjfehr
output_dir: outputs
seed: 42
experiment_name: aug_hyper_all_cnn
output_path: outputs/arc1d_hypermodel_augmented/aug_hyper_all_cnn
data: arc_1d_meta_multiclass
data_dir: data/arc_1d_augmented
model: hyper_model
primary_metric: val_query_exact_match
num_workers: 0
task_categories:
  - 1d_move_1p
  - 1d_move_2p
  - 1d_move_3p
  - 1d_move_dp
  - 1d_move_2p_dp
  - 1d_fill
  - 1d_hollow
  - 1d_flip
  - 1d_mirror
  - 1d_denoising_1c
  - 1d_denoising_mc
  - 1d_pcopy_1c
  - 1d_pcopy_mc
  - 1d_recolor_oe
  - 1d_recolor_cnt
  - 1d_recolor_cmp
  - 1d_scale_dp
  - 1d_padded_fill
task_ids: null
val_task_categories:
  - 1d_move_1p
  - 1d_move_2p
  - 1d_move_3p
  - 1d_move_dp
  - 1d_move_2p_dp
  - 1d_fill
  - 1d_hollow
  - 1d_flip
  - 1d_mirror
  - 1d_denoising_1c
  - 1d_denoising_mc
  - 1d_pcopy_1c
  - 1d_pcopy_mc
  - 1d_recolor_oe
  - 1d_recolor_cnt
  - 1d_recolor_cmp
  - 1d_scale_dp
  - 1d_padded_fill
train_split: train
val_split: val
test_split: test
overfit_single_batch: false

accelerator: auto
float32_matmul_precision: medium
devices: auto
optimizer: RAdam
batch_size: 2048
learning_rate: 0.005
gradient_clip_val: 1.0
weight_decay: 0.01
lr_scheduler:
  name: CosineAnnealingLR
  params:
    T_max: 10000
    eta_min: 0.0001
max_steps: 10000
warmup_steps: 500
log_task_examples: true
log_task_examples_every_n_epochs: 100
num_periodic_train_task_examples: 100
num_periodic_val_task_examples: 100

prediction_task: multiclass
num_classes: 10
padding_idx: 10
stop_on_perfect_val_exact_match: false

task_encoding:
  embedding_dim: 16
  value_vocab_size: 11

hyper_model:
  name: transformer
  params:
    hidden_dim: 128
    num_heads: 8
    num_layers: 4
    output_dim: 128

hyper_head:
  pooling: hierarchical
  projection_dims: [128, 256, 512, 1024]

target_model:
  name: cnn
  params:
    hidden_dim: 32
    num_layers: 2
    kernel_size: 5
    activation: silu
    dropout: 0.0
    use_residual: true
