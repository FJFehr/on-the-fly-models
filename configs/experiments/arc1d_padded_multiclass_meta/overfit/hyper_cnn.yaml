_base_: configs/experiments/arc1d_padded_multiclass_meta/base.yaml
task: overfit
name: hyper_cnn
variant: single_task_8
experiment_name: ${data}_${task}_${name}_${variant}

task_categories:
  - 1d_move_1p
task_ids:
  - 8
train_split: train
val_split: train
test_split: train
overfit_single_batch: true
batch_size: 1
learning_rate: 0.01
weight_decay: 0.0
max_steps: 200
log_task_examples_every_n_epochs: 1
num_periodic_train_task_examples: 1
num_periodic_val_task_examples: 1
num_final_hard_val_task_examples: 3

hyper_model:
  task_encoder_hidden_dim: 32
  task_encoder_num_heads: 4
  task_encoder_num_layers: 2

target_model:
  cnn:
    hidden_channels: 16
    kernel_size: 3
    num_layers: 1
    use_skip_connections: false

training:
  loss_on_support: true
  loss_on_query: true
