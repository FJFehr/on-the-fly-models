# Base config for all arc1d_padded_multiclass_meta experiments.
project_name: arc1d_padded_multiclass_meta_experiments
entity: fjfehr
output_dir: outputs
seed: 42
experiment_name: ${data}_${task}_${model}
output_path: ${output_dir}/${project_name}/${experiment_name}

data: arc_1d_meta_padded_multiclass
data_dir: data/arc_1d_padded_multiclass
prediction_task: multiclass
num_classes: 10
primary_metric: val_query_exact_match_accuracy
num_workers: 0
task_categories:
  - "1d_${task}"
task_ids: null
train_split: train
val_split: val
test_split: test
overfit_single_batch: false

accelerator: auto
batch_size: 8
learning_rate: 0.001
optimizer: Adam
weight_decay: 0.01
max_steps: 1000

input_dim: 33
output_dim: 33
log_val_examples: false
max_logged_val_examples: 0
max_logged_val_examples_per_category: 0
log_val_examples_every_n_epochs: 0
log_task_examples: true
log_task_examples_every_n_epochs: 25
num_periodic_train_task_examples: 1
num_periodic_val_task_examples: 1
num_final_hard_val_task_examples: 3
stop_on_perfect_val_exact_match: false
