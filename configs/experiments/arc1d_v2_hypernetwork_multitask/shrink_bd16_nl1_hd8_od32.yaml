# Follow-up to shrink_bd16_nl1.yaml (54,736 params, matched the bd128/nl2
# baseline at 98.6% test EM): shrinks the encoder itself on top of that --
# hidden_dim 32->8, output_dim 64->32. Estimated 39,320 trainable params
# (~28% smaller than bd16_nl1, ~88% smaller than the original bd128/nl2).
# dim=6 target, frozen_td, single seed exploratory.
_base_: configs/experiments/arc1d_v2_hypernetwork_multitask/base.yaml
experiment_name: v2_hyper_multitask_shrink_bd16_nl1_hd8_od32

hyper_model:
  params:
    hidden_dim: 8
    num_heads: 4
    num_layers: 1
    output_dim: 32

hyper_head:
  bottleneck_dim: 16
  num_tasks: 18
  freeze_task_indicator: true
