# "Matched-scale" hypernetwork: every dimension in the pipeline set to the
# same size as the dim=4 target it's generating, rather than staying at a
# larger fixed width. Deviates deliberately from Experiment 1's convention
# of holding task_encoding.embedding_dim fixed (that convention exists to
# isolate backbone capacity for a fair individual-training comparison; here
# the goal is a genuinely minimal, proportionally-sized whole system, not
# an isolated capacity measurement).
#
# Pipeline: embedding_dim=4 -> encoder hidden_dim=4/output_dim=4 (1 head,
# num_layers=1, matching the target's own num_heads=1 at this width) ->
# pooled 4-dim task vector -> bottleneck_dim=8 -> final projection to the
# dim=4 target's total_target_params. Single seed, frozen_td, exploratory.
_base_: configs/experiments/arc1d_v2_hypernetwork_multitask/base.yaml
experiment_name: v2_hyper_multitask_shrink_matched_dim4

task_encoding:
  embedding_dim: 4

target_model:
  params:
    hidden_dim: 4
    inner_dim: 4

hyper_model:
  params:
    hidden_dim: 4
    num_heads: 1
    num_layers: 1
    output_dim: 4

hyper_head:
  bottleneck_dim: 8
  num_tasks: 18
  freeze_task_indicator: true
