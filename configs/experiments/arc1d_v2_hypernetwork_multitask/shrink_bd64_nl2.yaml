# Hypernetwork-size shrink sweep (dim=6 target, frozen_td only -- isolates
# capacity from the descriptor question, matching how the encoder-size
# smoke test was validated). bottleneck_dim is the dominant parameter lever
# (not encoder size -- see README.md's "Hypernetwork size" note), so this
# sweeps bottleneck_dim in {64,32,16,8} at num_layers=2 first, then repeats
# at num_layers=1 (untested elsewhere). Single seed each, exploratory --
# same success bar as the earlier encoder-size smoke tests before any of
# these get a full 3-seed run.
_base_: configs/experiments/arc1d_v2_hypernetwork_multitask/base.yaml
experiment_name: v2_hyper_multitask_shrink_bd64_nl2

hyper_model:
  params:
    num_layers: 2

hyper_head:
  bottleneck_dim: 64
  num_tasks: 18
  freeze_task_indicator: true
