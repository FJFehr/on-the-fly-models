# Does the shrunk hypernetwork (bottleneck_dim=16, num_layers=1 -- matched
# the bd128/nl2 baseline at dim=6, 98.6% test EM, 58,198 params) also work
# generating the dim=4 target (1,398 params individually, 95.7% mean under
# the original bd128/nl2 hypernetwork in the main grid -- see README.md)?
# Single seed, frozen_td, exploratory.
_base_: configs/experiments/arc1d_v2_hypernetwork_multitask/base.yaml
experiment_name: v2_hyper_multitask_shrink_bd16_nl1_dim4

target_model:
  params:
    hidden_dim: 4
    inner_dim: 4

hyper_model:
  params:
    num_layers: 1

hyper_head:
  bottleneck_dim: 16
  num_tasks: 18
  freeze_task_indicator: true
