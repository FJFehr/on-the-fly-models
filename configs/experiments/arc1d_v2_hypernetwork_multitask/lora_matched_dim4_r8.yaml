# Presentation-grade LoRA-rank sweep at the smallest confirmed-stable
# hypernetwork size (matched_dim4: embedding_dim=4, encoder hidden_dim=4/
# num_heads=1/num_layers=1/output_dim=4, dim=4 target -- 10,156 params
# dense/full-generation, confirmed stable on torrnode7, mean 95.7% test EM
# over 3 seeds). Swaps the generation head from full/dense to LoRA adapter
# mode at rank=8. Note: the target's own weight matrices are mostly 4x4
# (one 4x10 output head), so rank>=4 exceeds full rank on the 4x4 tensors --
# not a meaningful low-rank constraint there, but still an informative point
# on the sweep (should behave ~identically to dense at high rank).
# 5 seeds -- presentation run, not exploratory.
_base_: configs/experiments/arc1d_v2_hypernetwork_multitask/base.yaml
experiment_name: v2_hyper_multitask_lora_matched_dim4_r8

task_encoding:
  embedding_dim: 4

target_model:
  params:
    hidden_dim: 4
    inner_dim: 4

hyper_model:
  params:
    hidden_dim: 4
    num_heads: 1
    num_layers: 1
    output_dim: 4

hyper_head:
  bottleneck_dim: 8
  num_tasks: 18
  freeze_task_indicator: true
  lora_adapter: true
  lora_adapter_rank: 8
