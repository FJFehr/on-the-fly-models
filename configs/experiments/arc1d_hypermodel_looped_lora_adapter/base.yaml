# Base config for the random-backbone + generated LoRA-adapter hypernetwork experiment.
#
# Self-contained (no _base_) because the config loader resolves only one level of
# inheritance (training/config.py), and arc1d_hypermodel_looped_mix11/mix11_td.yaml -- the
# comparison baseline this flattens together -- already has its own _base_. Combines
# arc1d_hypermodel_looped/base_hypermodel_looped.yaml's dataset/optimizer/schedule/
# hyper_model settings with mix11_td.yaml's 11-task descriptor-mix overrides, so this is a
# single-variable change relative to that baseline: hyper_head.lora_adapter: true is the
# only new axis. See README.md in this directory for the mechanism and rationale.
project_name: arc1d_hypermodel_looped_lora_adapter
entity: fjfehr
output_dir: outputs
seed: 42
experiment_name: looped_hyper_lora_adapter
output_path: ${output_dir}/${project_name}/${experiment_name}

data: arc_1d_meta_multiclass
data_dir: data/arc_1d_looped_augmented
model: hyper_model
primary_metric: val_loss
num_workers: 0

task_categories:
  - 1d_denoising_1c
  - 1d_denoising_mc
  - 1d_fill
  - 1d_hollow
  - 1d_mirror
  - 1d_move_1p
  - 1d_move_2p_dp
  - 1d_move_dp
  - 1d_pcopy_1c
  - 1d_pcopy_mc
  - 1d_scale_dp
task_ids: null
val_task_categories:
  - 1d_denoising_1c
  - 1d_denoising_mc
  - 1d_fill
  - 1d_hollow
  - 1d_mirror
  - 1d_move_1p
  - 1d_move_2p_dp
  - 1d_move_dp
  - 1d_pcopy_1c
  - 1d_pcopy_mc
  - 1d_scale_dp
train_split: train
val_split: val
test_split: test
overfit_single_batch: false

# Use all GPUs on the node (train.py resolves "auto" -> all free GPUs, see
# resolve_free_gpus in training/gpu_utils.py), matching mix11_td.yaml's convention.
accelerator: auto
float32_matmul_precision: medium
precision: bf16-mixed
devices: auto
optimizer: RAdam
batch_size: 512
learning_rate: 0.001
weight_decay: 0.01
lr_scheduler:
  name: CosineAnnealingLR
  params:
    T_max: ${max_steps}
    eta_min: 0.0001
# Compute-matched with base_hypermodel_looped.yaml's N_supervision=2/max_steps=1000
# default (max_steps * N_supervision = 2000 total optimizer updates either way);
# warmup stays at 10% of max_steps. Mirrors mix11_td.yaml's own N_supervision=4 override.
max_steps: 500
warmup_steps: 50
log_task_examples: true
log_task_examples_every_n_epochs: 100
num_periodic_train_task_examples: 100
num_periodic_val_task_examples: 100

prediction_task: multiclass
num_classes: 10
padding_idx: 10
stop_on_perfect_val_exact_match: false

N_supervision: 4

task_encoding:
  embedding_dim: 16
  value_vocab_size: 11

hyper_model:
  name: transformer
  params:
    hidden_dim: 64
    num_heads: 4
    num_layers: 2
    output_dim: 64

# Same rope_canon_looped_transformer capacity settings as mix11_td.yaml (the winning
# n_loops=8/N_supervision=4/block+loop-skip settings from the flip+recolor sweep), so the
# only difference between this project and that baseline is the weight-generation mode.
target_model:
  name: rope_canon_looped_transformer
  params:
    hidden_dim: 16
    num_heads: 2
    inner_dim: 16
    inner_num_heads: 2
    n_loops: 8
    dropout: 0.1
    canon_set: ABCD
    canon_kernel: 5
    canon_activation: true
    canon_residual: true
    canon_causal: false
    use_block_skip: true
    use_loop_skip: true

hyper_head:
  pooling: hierarchical
  bottleneck_dim: 128
  num_tasks: 18
  lora_adapter: true
