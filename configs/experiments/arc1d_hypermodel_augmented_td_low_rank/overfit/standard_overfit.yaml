_base_: configs/experiments/arc1d_hypermodel_augmented_td_low_rank/base.yaml
experiment_name: aug_hyper_rnn_standard_overfit
hyper_head:
  num_tasks: 18
  low_rank_output: false

task_categories:
  - 1d_move_1p
val_task_categories:
  - 1d_move_1p
task_ids:
  - 8
train_split: train
val_split: train
test_split: train
overfit_single_batch: true

accelerator: cpu
precision: 32
float32_matmul_precision: high
num_workers: 0
devices: 1

batch_size: 1
learning_rate: 0.01
weight_decay: 0.0
gradient_clip_val: 0.0
warmup_steps: 0
max_steps: 500
lr_scheduler:
  name: CosineAnnealingLR
  params:
    T_max: 500
    eta_min: 0.0001
log_task_examples: false
