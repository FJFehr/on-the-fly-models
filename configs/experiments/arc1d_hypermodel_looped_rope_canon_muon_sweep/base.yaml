# Base config for the Muon hyperparameter/architecture sweep. Follow-up to
# arc1d_hypermodel_looped_rope_canon_muon, whose arm_notd_muon/arm_frozentd_muon arms used an
# untuned muon_lr=0.005 (lowered 4x from Keller Jordan's published 0.02 only to fix a NaN
# divergence, see that experiment's README.md) with the same learning_rate/weight_decay/
# batch_size as the AdamW arms. This experiment asks: is there a better muon_lr / aux
# learning_rate / weight_decay / batch_size combination, and does excluding the LoRA head's
# A/B factor projections (lora_proj_a/lora_proj_b) from Muon help?
#
# Fabio's goal for this sweep specifically: speed up training and get the notd (no
# task-identity signal) runs to solve more task categories -- not a general optimizer
# comparison, so only the notd variant is covered here (frozen_td is out of scope; see
# arc1d_hypermodel_looped_rope_canon_muon's README for that hypothesis).
#
# Same backbone as arc1d_hypermodel_looped_rope_canon_muon: Zhu block (RMSNorm + QK-norm +
# SwiGLU), same 15 in-distribution task categories, same max_steps/warmup_steps schedule.
#
# devices: 1 (not auto, unlike arc1d_hypermodel_looped_rope_canon_muon's base.yaml) -- this
# sweep is 216 single-GPU jobs, run GPU-parallel via
# scripts/run_hypermodel_looped_rope_canon_muon_sweep.sh's GPUS="0,1,2,..." round-robin, not
# sequentially with each job claiming the whole node.
#
# muon_lr/learning_rate/weight_decay/batch_size/muon_exclude_lora_heads are placeholders here
# (set to the previous experiment's untuned defaults), overridden per leaf by
# scripts/gen_hypermodel_muon_sweep_configs.py. See README.md for the full grid.
#
# Self-contained (no _base_ of its own), matching every sibling base.yaml, because the config
# loader only resolves one level of _base_ inheritance (training/config.py).
project_name: arc1d_hypermodel_looped_rope_canon_muon_sweep
entity: fjfehr
output_dir: outputs
seed: 42
experiment_name: looped_hyper_rope_canon_muon_sweep
output_path: ${output_dir}/${project_name}/${experiment_name}

data: arc_1d_meta_multiclass
data_dir: data/arc_1d_looped_augmented
model: hyper_model
primary_metric: val_loss
num_workers: 0

task_categories:
  - 1d_denoising_1c
  - 1d_denoising_mc
  - 1d_fill
  - 1d_flip
  - 1d_hollow
  - 1d_mirror
  - 1d_move_1p
  - 1d_move_2p
  - 1d_move_2p_dp
  - 1d_move_3p
  - 1d_move_dp
  - 1d_pcopy_1c
  - 1d_pcopy_mc
  - 1d_recolor_cmp
  - 1d_scale_dp
task_ids: null
val_task_categories:
  - 1d_denoising_1c
  - 1d_denoising_mc
  - 1d_fill
  - 1d_flip
  - 1d_hollow
  - 1d_mirror
  - 1d_move_1p
  - 1d_move_2p
  - 1d_move_2p_dp
  - 1d_move_3p
  - 1d_move_dp
  - 1d_pcopy_1c
  - 1d_pcopy_mc
  - 1d_recolor_cmp
  - 1d_scale_dp
train_split: train
val_split: val
test_split: test
overfit_single_batch: false

accelerator: auto
float32_matmul_precision: medium
precision: bf16-mixed
devices: 1
optimizer: Muon
batch_size: 512
learning_rate: 0.001
muon_lr: 0.005
muon_momentum: 0.95
muon_exclude_lora_heads: false
weight_decay: 0.01
gradient_clip_val: 10.0
lr_scheduler:
  name: CosineAnnealingLR
  params:
    T_max: ${max_steps}
    eta_min: 0.0001
max_steps: 4000
warmup_steps: 400
log_task_examples: true
log_task_examples_every_n_epochs: 100
num_periodic_train_task_examples: 100
num_periodic_val_task_examples: 100
log_embedding_clusters: true

prediction_task: multiclass
num_classes: 10
padding_idx: 10
stop_on_perfect_val_exact_match: false

N_supervision: 2

task_encoding:
  embedding_dim: 16
  value_vocab_size: 11
  use_sinusoidal_pe: false

target_model:
  name: rope_canon_looped_transformer
  params:
    hidden_dim: 16
    num_heads: 2
    inner_dim: 16
    inner_num_heads: 2
    n_loops: 4
    dropout: 0.1
    canon_set: ABCD
    canon_kernel: 5
    canon_activation: true
    canon_residual: true
    canon_causal: false
    use_block_skip: false
    use_loop_skip: false

# Fixed Zhu backbone across every cell in this sweep.
hyper_model:
  name: rope_canon_zhu_transformer
  params:
    hidden_dim: 64
    num_heads: 4
    num_layers: 8
    output_dim: 64
    canon_set: ABCD
    canon_kernel: 5
    canon_activation: true
    canon_residual: true
    canon_causal: false
    block_size: 2048
    use_rmsnorm: true
    use_qk_norm: true
    use_swiglu: true

# notd only, baked in (no per-leaf override needed): no task-identity signal.
hyper_head:
  pooling: attention
  bottleneck_dim: 128
  num_tasks: null
  freeze_task_indicator: false
  lora_adapter: true
  lora_adapter_rank: 8
  lora_adapter_zero_backbone: false
