# Base config for the binary meta-learning track.
# This mirrors the older hyper-RNN experiments while keeping the task binary
# and the target model stateless.
project_name: arc1d_simple_meta_experiments
entity: fjfehr
output_dir: outputs
seed: 42
experiment_name: ${data}_${task}_${model}
output_path: ${output_dir}/${project_name}/${experiment_name}

data: arc_1d_meta_simple
data_dir: data/arc_1d_simple
model: binary_hyper_rnn
primary_metric: val_query_exact_match_accuracy
num_workers: 0
task_categories:
  - "1d_${task}"
task_ids: null
train_split: train
val_split: val
test_split: test
overfit_single_batch: false

accelerator: auto
batch_size: 16 # Used to be 8
learning_rate: 0.001
optimizer: Adam
weight_decay: 0.01
max_steps: 10000

input_dim: 33
output_dim: 33
prediction_task: binary
log_task_examples: true
log_task_examples_every_n_epochs: 50
log_task_attention: true
log_task_attention_every_n_epochs: 50
attention_head_reduction: mean
num_periodic_train_task_examples: 1
num_periodic_val_task_examples: 1
num_final_hard_val_task_examples: 3
stop_on_perfect_val_exact_match: false

hyper_model:
  task_encoder_hidden_dim: 32
  task_encoder_num_heads: 1
  task_encoder_num_layers: 2
  task_encoder_bias: false

target_model:
  rnn:
    hidden_dim: 32
    bidirectional: true
    num_layers: 1
    use_skip_connections: false

training:
  loss_on_support: true
  loss_on_query: true
