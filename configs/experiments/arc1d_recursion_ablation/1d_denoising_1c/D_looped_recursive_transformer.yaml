_base_: configs/experiments/arc1d_recursion_ablation/base_ablation.yaml
# Condition D: weight-shared transformer + 4 optimizer steps per batch (both forms).
# max_steps=2000 × N_supervision=4 = 8 000 total optimizer steps (matches A and B).
experiment_name: ablation_D_denoising1c_looped_recursive_transformer
task_categories:
  - 1d_denoising_1c
model: looped_supervised
N_supervision: 4
max_steps: 2000
backbone_model:
  name: recursive_transformer
  params:
    hidden_dim: 256
    num_layers: 2
    num_heads: 4
    n_loops: 4
    dropout: 0.1
