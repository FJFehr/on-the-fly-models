# N_supervision comparison arm: 2 -> 4, compute-matched against arm_default (max_steps *
# N_supervision held at a fixed 8000 total optimizer updates: 4000*2 here vs. 2000*4 there),
# so this isolates supervision granularity rather than also confounding it with more total
# training. warmup_steps stays at 10% of max_steps. See README.md.
_base_: configs/experiments/arc1d_hypermodel_looped_rope_canon_followup/base.yaml
experiment_name: looped_hyper_rope_canon_followup_nsup4

N_supervision: 4
max_steps: 2000
warmup_steps: 200
lr_scheduler:
  name: CosineAnnealingLR
  params:
    T_max: ${max_steps}
    eta_min: 0.0001
