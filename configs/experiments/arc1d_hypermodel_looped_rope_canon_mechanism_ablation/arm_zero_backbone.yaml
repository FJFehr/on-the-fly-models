# New mechanism question: does the LoRA adapter's frozen random backbone actually matter, or
# does the generated low-rank delta alone do just as well? Single-axis flip from the baseline
# (rank8.yaml's settings): lora_adapter_zero_backbone: true makes the backbone 0 instead of
# the target model's real random init (models/hypermodel.py). B is NOT zero-initialized for
# this arm (models/hypermodel.py skips that when this flag is set). With backbone=0, a
# zero-init B would make the whole target model start at exactly zero, a dead-gradient trap,
# confirmed empirically during implementation. See base.yaml and README.md.
_base_: configs/experiments/arc1d_hypermodel_looped_rope_canon_mechanism_ablation/base.yaml
experiment_name: looped_hyper_rope_canon_mechanism_ablation_zero_backbone

hyper_head:
  lora_adapter_zero_backbone: true
