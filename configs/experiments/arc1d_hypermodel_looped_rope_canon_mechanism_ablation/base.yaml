# Base config for the mechanism ablation at rank=8, following on from
# arc1d_hypermodel_looped_rope_canon_rank_sweep's results: rank 8 unlocked every task except
# 1d_recolor_oe/1d_recolor_cnt, but that result "wasn't as high as" the earlier followup
# experiment's rank-8-equivalent settings. Two things changed between those two experiments at
# once (gradient_clip_val 10->5, and pooling hierarchical->attention), so which one (or both)
# caused the regression was confounded. This experiment re-isolates each factor with a
# single-axis flip from the rank_sweep's rank8.yaml settings (not the full 2x2 factorial, per
# Fabio's direction), and adds two new mechanism questions on top: does the LoRA adapter's
# random backbone matter vs. a zero backbone, and can the model still learn multiple tasks
# without the explicit one-hot task-identity signal.
#
# This is a byte-for-byte fork of arc1d_hypermodel_looped_rope_canon_rank_sweep/base.yaml with
# lora_adapter_rank hardcoded to 8 (no longer swept, confirmed the winning rank) and a new
# lora_adapter_zero_backbone: false default added (documents the new flag explicitly; the
# HyperModel default is also false, so this is inert unless a leaf overrides it).
#
# IMPORTANT, found during implementation (not something to silently rely on if reusing this
# flag elsewhere): lora_proj_b is normally zero-initialized (models/hypermodel.py) so the LoRA
# delta starts at exactly zero on top of a nonzero backbone. With lora_adapter_zero_backbone
# also true, that assumption breaks (backbone=0 AND delta=0 at step 0 would be a fully dead
# network with zero gradient, confirmed empirically). models/hypermodel.py now skips the
# zero-init for B specifically when lora_adapter_zero_backbone=True, so arm_zero_backbone.yaml
# can actually train.
#
# Self-contained (no _base_ of its own), matching every sibling base.yaml, because the config
# loader only resolves one level of _base_ inheritance (training/config.py).
project_name: arc1d_hypermodel_looped_rope_canon_mechanism_ablation
entity: fjfehr
output_dir: outputs
seed: 42
experiment_name: looped_hyper_rope_canon_mechanism_ablation
output_path: ${output_dir}/${project_name}/${experiment_name}

data: arc_1d_meta_multiclass
data_dir: data/arc_1d_looped_augmented
model: hyper_model
primary_metric: val_loss
num_workers: 0

task_categories:
  - 1d_denoising_1c
  - 1d_denoising_mc
  - 1d_fill
  - 1d_flip
  - 1d_hollow
  - 1d_mirror
  - 1d_move_1p
  - 1d_move_2p
  - 1d_move_2p_dp
  - 1d_move_3p
  - 1d_move_dp
  - 1d_pcopy_1c
  - 1d_pcopy_mc
  - 1d_recolor_cmp
  - 1d_recolor_cnt
  - 1d_recolor_oe
  - 1d_scale_dp
task_ids: null
val_task_categories:
  - 1d_denoising_1c
  - 1d_denoising_mc
  - 1d_fill
  - 1d_flip
  - 1d_hollow
  - 1d_mirror
  - 1d_move_1p
  - 1d_move_2p
  - 1d_move_2p_dp
  - 1d_move_3p
  - 1d_move_dp
  - 1d_pcopy_1c
  - 1d_pcopy_mc
  - 1d_recolor_cmp
  - 1d_recolor_cnt
  - 1d_recolor_oe
  - 1d_scale_dp
train_split: train
val_split: val
test_split: test
overfit_single_batch: false

# Use all GPUs on the node (train.py resolves "auto" -> all free GPUs, see
# resolve_free_gpus in training/gpu_utils.py), matching sibling conventions.
accelerator: auto
float32_matmul_precision: medium
precision: bf16-mixed
devices: auto
optimizer: RAdam
batch_size: 512
learning_rate: 0.001
weight_decay: 0.01
# Baseline value from rope_canon_rank_sweep. arm_clip10.yaml overrides this back to 10 to
# re-isolate whether this change caused the rank=8 regression.
gradient_clip_val: 5.0
lr_scheduler:
  name: CosineAnnealingLR
  params:
    T_max: ${max_steps}
    eta_min: 0.0001
max_steps: 4000
warmup_steps: 400
log_task_examples: true
log_task_examples_every_n_epochs: 100
num_periodic_train_task_examples: 100
num_periodic_val_task_examples: 100

prediction_task: multiclass
num_classes: 10
padding_idx: 10
stop_on_perfect_val_exact_match: false

# Fixed at 2: the followup experiment found N_supervision=4 made no measurable difference.
N_supervision: 2

task_encoding:
  embedding_dim: 16
  value_vocab_size: 11
  use_sinusoidal_pe: false

# Fixed across every arm. Exact match to
# arc1d_hypermodel_looped_rope_canon_rank_sweep/base.yaml's target_model block.
target_model:
  name: rope_canon_looped_transformer
  params:
    hidden_dim: 16
    num_heads: 2
    inner_dim: 16
    inner_num_heads: 2
    n_loops: 4
    dropout: 0.1
    canon_set: ABCD
    canon_kernel: 5
    canon_activation: true
    canon_residual: true
    canon_causal: false
    use_block_skip: false
    use_loop_skip: false

# Fixed across every arm: RoPE+Canon encoder, num_layers=4.
hyper_model:
  name: rope_canon_transformer
  params:
    hidden_dim: 64
    num_heads: 4
    num_layers: 4
    output_dim: 64
    canon_set: ABCD
    canon_kernel: 5
    canon_activation: true
    canon_residual: true
    canon_causal: false
    block_size: 2048

# rank=8 (confirmed winning rank, no longer swept), attention pooling (baseline; overridden
# by arm_hierarchical.yaml), lora_adapter_zero_backbone explicit false (overridden by
# arm_zero_backbone.yaml), num_tasks=18 (overridden to null by arm_no_task_indicator.yaml).
hyper_head:
  pooling: attention
  bottleneck_dim: 128
  num_tasks: 18
  lora_adapter: true
  lora_adapter_rank: 8
  lora_adapter_zero_backbone: false
