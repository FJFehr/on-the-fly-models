_base_: configs/experiments/arc1d_capacity_looped/base_looped.yaml
experiment_name: overfit_looped_medium_transformer
# Train all 3 difficulty tiers simultaneously on a single batch.
# Goal: verify the looped model can memorise harder tasks where the baseline fails.
task_categories:
  - 1d_denoising_1c
  - 1d_scale_dp
  - 1d_fill
model: looped_supervised
N_supervision: 4
overfit_single_batch: true
max_steps: 2000
lr_scheduler:
  name: CosineAnnealingLR
  params:
    T_max: 2000
    eta_min: 0.0001
backbone_model:
  name: transformer
  params:
    hidden_dim: 20
    num_layers: 2
    num_heads: 4
    dropout: 0.0
