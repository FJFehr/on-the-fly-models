# Base config for arc1d_capacity_looped experiments.
# A/B test: standard transformer (model: direct_supervised) vs
# looped transformer (model: looped_supervised, N_supervision=4).
# Both backbones use medium capacity: hidden_dim=20, 2 layers, 4 heads.
# Training budget matches arc1d_capacity_augmented_medium for comparability.
project_name: arc1d_capacity_looped
entity: fjfehr
output_dir: outputs
seed: 42
experiment_name: ${experiment_name}
output_path: ${output_dir}/${project_name}/${experiment_name}

data: arc_1d_direct
data_dir: data/arc_1d_looped_augmented
model: looped_supervised
primary_metric: val_loss
stop_on_perfect_val_exact_match: false

N_supervision: 4

task_categories: null
task_ids: null
val_task_categories: null
train_split: train
val_split: dev
test_split: test
overfit_single_batch: false

accelerator: auto
float32_matmul_precision: medium
devices: 1
num_workers: 1
optimizer: RAdam
batch_size: 1024
learning_rate: 0.001
# gradient_clip_val omitted: looped_supervised clips manually; baseline configs set it explicitly
weight_decay: 0.01
lr_scheduler:
  name: CosineAnnealingLR
  params:
    T_max: ${max_steps}
    eta_min: 0.0001
max_steps: 8000
log_task_examples: true
log_task_examples_every_n_epochs: 200
non_background_loss_weight: 1.0

prediction_task: multiclass
num_classes: 10
padding_idx: 10

task_encoding:
  embedding_dim: 16
  value_vocab_size: 11
